<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=720,height=480">
<script src="gsap.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:720px;height:480px;background:transparent;overflow:hidden}
#root{width:720px;height:480px;background:transparent}
.scene-content{width:100%;height:100%;padding:58px 80px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px}
.badge{width:184px;height:184px;position:relative;flex:none}
.robot{width:184px;height:184px;display:block;border-radius:50%;position:relative}
.arcs{position:absolute;inset:-10px;width:204px;height:204px;overflow:visible}
.arc{fill:none;stroke:#fbc21a;stroke-width:7;stroke-linecap:round}
.word{margin:0;color:#fbc21a;font:700 60px/1.15 Georgia,'Times New Roman',serif;letter-spacing:-1px;-webkit-text-stroke:2px #346bc0;paint-order:stroke fill}
</style></head><body>
<div id="root" data-composition-id="run50-intro" data-start="0" data-duration="5" data-width="720" data-height="480">
<div id="scene" class="scene-content clip" data-start="0" data-duration="5" data-track-index="0">
<div class="badge"><svg class="arcs" viewBox="0 0 204 204" aria-hidden="true"><path class="arc" d="M 22 102 A 80 80 0 0 1 102 22"/><path class="arc" d="M 182 102 A 80 80 0 0 1 102 182"/></svg><svg class="robot" viewBox="0 0 267 267" role="img" aria-label="原地小跑的蓝色机器人">
<circle cx="133.5" cy="133.5" r="133.5" fill="#fbc21a"/>
<g fill="none" stroke="#346bc0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
<g class="speed-lines"><path d="M52 75H93 M73 88H94 M52 185H94 M74 172H94"/></g>
<g class="runner-body">
<g class="arm-back"><path d="M111 108H76V137 Q65 151 79 158 Q96 156 86 141 V120H109"/></g>
<g class="leg-back"><path d="M109 157V195H93V201H81V233H91V214H127V190H144V177"/></g>
<g class="leg-front"><path d="M134 158H163V168H191V197H202V213H172V201H181V179H163V186H143"/></g>
<path d="M109 103H132L156 118V157H109Z M110 158V184H143"/>
<g class="head"><path d="M108 40H157V90H108Z M127 32L135 40V32L145 40V32L157 42"/><circle cx="140" cy="58" r="7" fill="#346bc0" stroke="none"/></g>
<g class="arm-front"><path d="M143 104H170V96 Q161 84 172 78 Q186 70 189 85 Q190 92 183 97V122H139 Q127 122 129 115 Q128 108 143 108"/></g>
</g></g></svg></div>
<p class="word">Run50</p>
</div></div>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.from('.arcs',{scale:.6,rotation:-100,opacity:0,duration:.6,ease:'power2.out'},.15)
  .to('.arcs',{rotation:90,duration:.65,ease:'power1.inOut'},.75)
  .from('.robot',{scale:.05,rotation:-18,opacity:0,duration:.65,ease:'back.out(1.15)'},.95)
  .to('.arcs',{scale:1.1,opacity:0,duration:.4,ease:'power2.out'},1.4)
  .from('.word',{y:10,scale:.95,opacity:0,duration:.45,ease:'power3.out'},1.6)
  .to('.word',{opacity:0,y:5,duration:.35,ease:'power1.in'},4.2)
  .to('.robot',{scale:.9,opacity:0,duration:.35,ease:'power2.in'},4.4);
tl.fromTo('.leg-front',{rotation:-18},{rotation:23,svgOrigin:'134 158',duration:.24,yoyo:true,repeat:9,ease:'sine.inOut'},1.7)
  .fromTo('.leg-back',{rotation:20},{rotation:-22,svgOrigin:'120 158',duration:.24,yoyo:true,repeat:9,ease:'sine.inOut'},1.7)
  .fromTo('.arm-front',{rotation:12},{rotation:-24,svgOrigin:'132 108',duration:.24,yoyo:true,repeat:9,ease:'sine.inOut'},1.7)
  .fromTo('.arm-back',{rotation:-14},{rotation:24,svgOrigin:'110 108',duration:.24,yoyo:true,repeat:9,ease:'sine.inOut'},1.7)
  .fromTo('.runner-body',{y:0},{y:-5,duration:.12,yoyo:true,repeat:19,ease:'sine.inOut'},1.7)
  .fromTo('.speed-lines',{x:0},{x:-5,opacity:.55,duration:.24,yoyo:true,repeat:9,ease:'sine.inOut'},1.7);
window.__timelines['run50-intro']=tl;tl.seek(0);
</script></body></html>
