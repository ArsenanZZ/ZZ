<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=720,height=480">
<script src="gsap.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:720px;height:480px;background:transparent;overflow:hidden}
#root{width:720px;height:480px;background:transparent}
.scene-content{width:100%;height:100%;padding:58px 80px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px}
.badge{width:184px;height:184px;position:relative;flex:none}
.robot{width:184px;height:184px;display:block;border-radius:50%;position:relative}
.arcs{position:absolute;inset:-10px;width:204px;height:204px;overflow:visible}
.arc{fill:none;stroke:#fbc21a;stroke-width:7;stroke-linecap:round}
.word{margin:0;color:#fbc21a;font:700 60px/1.15 Georgia,'Times New Roman',serif;letter-spacing:-1px;-webkit-text-stroke:2px #346bc0;paint-order:stroke fill}
</style></head><body>
<div id="root" data-composition-id="run50-intro" data-start="0" data-duration="5" data-width="720" data-height="480">
<div id="scene" class="scene-content clip" data-start="0" data-duration="5" data-track-index="0">
<div class="badge"><svg class="arcs" viewBox="0 0 204 204" aria-hidden="true"><path class="arc" d="M 22 102 A 80 80 0 0 1 102 22"/><path class="arc" d="M 182 102 A 80 80 0 0 1 102 182"/></svg><img class="robot" src="robot.png" alt="Arsenan running robot"></div>
<p class="word">Run50</p>
</div></div>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.from('.arcs',{scale:.6,rotation:-100,opacity:0,duration:.6,ease:'power2.out'},.15)
  .to('.arcs',{rotation:90,duration:.65,ease:'power1.inOut'},.75)
  .from('.robot',{scale:.05,rotation:-18,opacity:0,duration:.65,ease:'back.out(1.15)'},.95)
  .to('.arcs',{scale:1.1,opacity:0,duration:.4,ease:'power2.out'},1.4)
  .from('.word',{y:10,scale:.95,opacity:0,duration:.45,ease:'power3.out'},1.6)
  .to('.word',{opacity:0,y:5,duration:.35,ease:'power1.in'},4.2)
  .to('.robot',{scale:.9,opacity:0,duration:.35,ease:'power2.in'},4.4);
window.__timelines['run50-intro']=tl;tl.seek(0);
</script></body></html>
