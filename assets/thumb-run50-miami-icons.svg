<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Miami Marathon icon cover</title>
  <desc id="desc">Icon style cover with Miami title, Run50 badge, skyscrapers, palm trees, MacArthur Causeway bridge, cruise ship, sun and medal.</desc>
  <rect width="1200" height="750" fill="#f6f8f3"/>
  <g transform="translate(70 104)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" fill="#20242b">MIAMI</text>
    <text x="0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f766e">PALMS · OCEAN · SHIPS</text>
  </g>
  <rect x="790" y="62" width="320" height="146" rx="22" fill="#ffffff" stroke="#20242b" stroke-width="8"/>
  <text x="820" y="122" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="900" fill="#20242b">Run50 #15</text>
  <text x="820" y="178" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="900" fill="#cc0000">MIAMI</text>
  
  <!-- Sun -->
  <circle cx="920" cy="340" r="68" fill="#f2b441"/>

  <!-- Wave 1 (background water) -->
  <path d="M0 600 C160 560 330 626 500 580 C672 532 826 612 990 572 C1080 552 1140 552 1200 520 L1200 750 L0 750 Z" fill="#0f766e"/>

  <!-- Cruise Ship -->
  <g transform="translate(80 10)">
    <path d="M720 540 L880 540 L900 510 L700 510 Z" fill="#20242b"/>
    <rect x="730" y="470" width="140" height="40" fill="#ffffff"/>
    <rect x="760" y="440" width="90" height="30" fill="#ffffff"/>
    <rect x="780" y="420" width="50" height="20" fill="#ffffff"/>
    <rect x="800" y="395" width="16" height="25" fill="#cc0000"/>
    <rect x="800" y="395" width="16" height="6" fill="#20242b"/>
    <circle cx="750" cy="490" r="4" fill="#f2b441"/>
    <circle cx="780" cy="490" r="4" fill="#f2b441"/>
    <circle cx="810" cy="490" r="4" fill="#f2b441"/>
    <circle cx="840" cy="490" r="4" fill="#f2b441"/>
  </g>

  <!-- High-rises (Skyline) -->
  <g>
    <!-- Building 1 -->
    <rect x="320" y="320" width="60" height="260" fill="#1e293b"/>
    <rect x="332" y="340" width="12" height="18" fill="#f2b441"/>
    <rect x="352" y="340" width="12" height="18" fill="#f2b441"/>
    <rect x="332" y="375" width="12" height="18" fill="#f2b441"/>
    <rect x="352" y="375" width="12" height="18" fill="#f2b441"/>
    <rect x="332" y="410" width="12" height="18" fill="#f2b441"/>
    <rect x="352" y="410" width="12" height="18" fill="#f2b441"/>
    <rect x="332" y="445" width="12" height="18" fill="#f2b441"/>
    <rect x="352" y="445" width="12" height="18" fill="#f2b441"/>
    <rect x="332" y="480" width="12" height="18" fill="#f2b441"/>
    <rect x="352" y="480" width="12" height="18" fill="#f2b441"/>

    <!-- Building 2 -->
    <rect x="400" y="270" width="80" height="310" fill="#2d3748"/>
    <path d="M400 270 L480 230 L480 270 Z" fill="#2d3748"/>
    <rect x="415" y="290" width="14" height="22" fill="#ffffff" opacity="0.8"/>
    <rect x="445" y="290" width="14" height="22" fill="#ffffff" opacity="0.8"/>
    <rect x="415" y="325" width="14" height="22" fill="#ffffff" opacity="0.8"/>
    <rect x="445" y="325" width="14" height="22" fill="#ffffff" opacity="0.8"/>
    <rect x="415" y="360" width="14" height="22" fill="#ffffff" opacity="0.8"/>
    <rect x="445" y="360" width="14" height="22" fill="#ffffff" opacity="0.8"/>
    <rect x="415" y="395" width="14" height="22" fill="#ffffff" opacity="0.8"/>
    <rect x="445" y="395" width="14" height="22" fill="#ffffff" opacity="0.8"/>
    <rect x="415" y="430" width="14" height="22" fill="#ffffff" opacity="0.8"/>
    <rect x="445" y="430" width="14" height="22" fill="#ffffff" opacity="0.8"/>

    <!-- Building 3 -->
    <rect x="500" y="350" width="70" height="230" fill="#1e3a8a"/>
    <rect x="515" y="370" width="12" height="18" fill="#f2b441"/>
    <rect x="540" y="370" width="12" height="18" fill="#f2b441"/>
    <rect x="515" y="405" width="12" height="18" fill="#f2b441"/>
    <rect x="540" y="405" width="12" height="18" fill="#f2b441"/>
    <rect x="515" y="440" width="12" height="18" fill="#f2b441"/>
    <rect x="540" y="440" width="12" height="18" fill="#f2b441"/>
    <rect x="515" y="475" width="12" height="18" fill="#f2b441"/>
    <rect x="540" y="475" width="12" height="18" fill="#f2b441"/>
  </g>

  <!-- MacArthur Causeway Bridge -->
  <g>
    <path d="M220 548 L1046 548" stroke="#7a4f2a" stroke-width="23" stroke-linecap="round" fill="none"/>
    <line x1="300" y1="548" x2="300" y2="600" stroke="#7a4f2a" stroke-width="12"/>
    <line x1="500" y1="548" x2="500" y2="600" stroke="#7a4f2a" stroke-width="12"/>
    <line x1="700" y1="548" x2="700" y2="600" stroke="#7a4f2a" stroke-width="12"/>
    <line x1="900" y1="548" x2="900" y2="600" stroke="#7a4f2a" stroke-width="12"/>
  </g>

  <!-- Wave 2 (foreground water) -->
  <path d="M0 654 C190 602 340 670 530 628 C720 584 868 670 1040 620 C1115 600 1160 616 1200 592 L1200 750 L0 750 Z" fill="#65b8b2"/>

  <!-- Palm Tree 1 -->
  <g>
    <path d="M120 630 C130 520 170 420 190 350" stroke="#7a4f2a" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M190 350 Q160 300 100 320" stroke="#2f855a" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M190 350 Q170 280 130 260" stroke="#2f855a" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M190 350 Q220 280 260 270" stroke="#2f855a" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M190 350 Q240 310 280 320" stroke="#2f855a" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M190 350 Q220 370 240 410" stroke="#2f855a" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M190 350 Q170 370 130 400" stroke="#2f855a" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Palm Tree 2 -->
  <g>
    <path d="M1080 620 C1070 510 1030 430 1010 370" stroke="#7a4f2a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M1010 370 Q980 330 920 350" stroke="#2f855a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M1010 370 Q990 300 950 280" stroke="#2f855a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M1010 370 Q1040 300 1080 290" stroke="#2f855a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M1010 370 Q1060 330 1100 340" stroke="#2f855a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M1010 370 Q1040 390 1060 430" stroke="#2f855a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M1010 370 Q990 390 950 420" stroke="#2f855a" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Ninja Star Medal -->
  <g transform="translate(300 650)">
    <path d="M-55 0 L-18 -18 L0 -55 L18 -18 L55 0 L18 18 L0 55 L-18 18 Z" fill="#d9a441" stroke="#8b5e20" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-39 -39 L0 -18 L39 -39 L18 0 L39 39 L0 18 L-39 39 L-18 0 Z" fill="#d9a441" stroke="#8b5e20" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="28" fill="#f6f8f3" stroke="#8b5e20" stroke-width="5"/>
    <!-- Small palm tree inside medal -->
    <path d="M-3 14 C-1 4 1 4 3 14" stroke="#7a4f2a" stroke-width="3" fill="none"/>
    <path d="M0 -1 Q-8 -8 -13 -2 M0 -1 Q-5 -12 0 -15 M0 -1 Q8 -8 13 -2 M0 -1 Q5 -12 0 -15" stroke="#2f855a" stroke-width="3.5" fill="none"/>
  </g>
</svg>
