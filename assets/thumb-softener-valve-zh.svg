<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">SOFTENER VALVES</title>
  <desc id="desc">Modern enamel plaque cover for the Chinese softener valve analysis.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
