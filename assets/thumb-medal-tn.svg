<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky-tn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08041a"/>
      <stop offset="45%" stop-color="#1e0c48"/>
      <stop offset="100%" stop-color="#3a1870"/>
    </linearGradient>
    <linearGradient id="gold-tn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9922a"/>
      <stop offset="45%" stop-color="#f5d07a"/>
      <stop offset="100%" stop-color="#b07820"/>
    </linearGradient>
    <linearGradient id="stage-tn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1040"/>
      <stop offset="100%" stop-color="#160828"/>
    </linearGradient>
  </defs>

  <!-- Night purple sky -->
  <rect width="800" height="500" fill="url(#sky-tn)"/>

  <!-- Stars -->
  <circle cx="90" cy="45" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="170" cy="75" r="1" fill="white" opacity="0.6"/>
  <circle cx="250" cy="38" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="480" cy="55" r="1" fill="white" opacity="0.65"/>
  <circle cx="560" cy="30" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="640" cy="65" r="1" fill="white" opacity="0.55"/>
  <circle cx="720" cy="42" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="760" cy="88" r="1" fill="white" opacity="0.5"/>
  <circle cx="330" cy="92" r="1" fill="white" opacity="0.45"/>
  <circle cx="430" cy="105" r="1.5" fill="white" opacity="0.4"/>

  <!-- Stage lights glow on ground -->
  <ellipse cx="280" cy="450" rx="90" ry="30" fill="#ff6020" opacity="0.15"/>
  <ellipse cx="520" cy="450" rx="90" ry="30" fill="#ff6020" opacity="0.12"/>
  <ellipse cx="400" cy="445" rx="70" ry="25" fill="#ffd040" opacity="0.1"/>

  <!-- Ground / stage area -->
  <rect x="0" y="405" width="800" height="95" fill="#0d0820"/>
  <rect x="0" y="400" width="800" height="12" fill="#1a1028"/>

  <!-- Guitar (center, large) -->
  <!-- Guitar neck -->
  <rect x="382" y="105" width="36" height="160" rx="6" fill="#6a3510"/>
  <!-- Guitar headstock -->
  <rect x="376" y="95" width="48" height="30" rx="5" fill="#8B4520"/>
  <!-- Tuning pegs -->
  <circle cx="382" cy="99" r="4" fill="#c0a040"/>
  <circle cx="382" cy="112" r="4" fill="#c0a040"/>
  <circle cx="382" cy="125" r="4" fill="#c0a040"/>
  <circle cx="418" cy="99" r="4" fill="#c0a040"/>
  <circle cx="418" cy="112" r="4" fill="#c0a040"/>
  <circle cx="418" cy="125" r="4" fill="#c0a040"/>
  <!-- Frets -->
  <line x1="382" y1="155" x2="418" y2="155" stroke="#c0a040" stroke-width="2"/>
  <line x1="382" y1="175" x2="418" y2="175" stroke="#c0a040" stroke-width="2"/>
  <line x1="382" y1="195" x2="418" y2="195" stroke="#c0a040" stroke-width="2"/>
  <line x1="382" y1="218" x2="418" y2="218" stroke="#c0a040" stroke-width="1.5"/>
  <line x1="382" y1="240" x2="418" y2="240" stroke="#c0a040" stroke-width="1.5"/>
  <!-- Guitar body (upper bout) -->
  <ellipse cx="400" cy="310" rx="68" ry="60" fill="#8B3a08"/>
  <ellipse cx="400" cy="310" rx="68" ry="60" fill="none" stroke="#6a2a04" stroke-width="3"/>
  <!-- Guitar body (lower bout - larger) -->
  <ellipse cx="400" cy="380" rx="80" ry="72" fill="#9a4210"/>
  <ellipse cx="400" cy="380" rx="80" ry="72" fill="none" stroke="#7a3208" stroke-width="3"/>
  <!-- Waist -->
  <rect x="358" y="318" width="84" height="44" fill="#8B3a08"/>
  <!-- Sound hole -->
  <circle cx="400" cy="350" r="28" fill="#4a1a04"/>
  <circle cx="400" cy="350" r="25" fill="none" stroke="#6a2a08" stroke-width="2"/>
  <!-- Strings -->
  <line x1="390" y1="255" x2="390" y2="440" stroke="#d4c060" stroke-width="1.2"/>
  <line x1="396" y1="255" x2="396" y2="440" stroke="#d4c060" stroke-width="1.2"/>
  <line x1="402" y1="255" x2="402" y2="440" stroke="#d4c060" stroke-width="1.2"/>
  <line x1="408" y1="255" x2="408" y2="440" stroke="#d4c060" stroke-width="1.2"/>
  <line x1="385" y1="260" x2="385" y2="440" stroke="#b8a840" stroke-width="1"/>
  <line x1="415" y1="260" x2="415" y2="440" stroke="#b8a840" stroke-width="1"/>
  <!-- Bridge -->
  <rect x="375" y="422" width="50" height="8" rx="3" fill="#6a2a04"/>

  <!-- Music notes scattered -->
  <text x="130" y="150" font-family="serif" font-size="48" fill="#d4a843" opacity="0.65">♪</text>
  <text x="640" y="170" font-family="serif" font-size="36" fill="#c090d0" opacity="0.55">♫</text>
  <text x="680" y="230" font-family="serif" font-size="28" fill="#d4a843" opacity="0.5">♩</text>
  <text x="90" y="220" font-family="serif" font-size="32" fill="#c090d0" opacity="0.45">♬</text>

  <!-- Parthenon columns (Nashville) subtle in background -->
  <rect x="545" y="280" width="12" height="120" fill="rgba(210,190,140,0.25)"/>
  <rect x="562" y="280" width="12" height="120" fill="rgba(210,190,140,0.25)"/>
  <rect x="579" y="280" width="12" height="120" fill="rgba(210,190,140,0.2)"/>
  <rect x="596" y="280" width="12" height="120" fill="rgba(210,190,140,0.25)"/>
  <rect x="613" y="280" width="12" height="120" fill="rgba(210,190,140,0.2)"/>
  <rect x="630" y="280" width="12" height="120" fill="rgba(210,190,140,0.25)"/>
  <rect x="540" y="272" width="110" height="14" fill="rgba(210,190,140,0.2)"/>
  <!-- Parthenon pediment -->
  <path d="M540,272 L595,238 L650,272 Z" fill="rgba(210,190,140,0.15)"/>
  <rect x="540" y="395" width="110" height="10" fill="rgba(210,190,140,0.2)"/>

  <!-- Gold medal border -->
  <rect x="7" y="7" width="786" height="486" rx="13" ry="13" fill="none" stroke="url(#gold-tn)" stroke-width="6"/>
  <rect x="16" y="16" width="768" height="468" rx="10" ry="10" fill="none" stroke="rgba(200,150,40,0.3)" stroke-width="1.5"/>
  <circle cx="28" cy="28" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>
  <circle cx="772" cy="28" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>
  <circle cx="28" cy="472" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>
  <circle cx="772" cy="472" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>

  <!-- Ribbon -->
  <path d="M376,0 L424,0 L424,38 L400,50 L376,38 Z" fill="#08041a"/>
  <path d="M382,0 L418,0 L418,34 L400,44 L382,34 Z" fill="#1e0c48"/>
  <circle cx="400" cy="7" r="5" fill="#c9922a" opacity="0.9"/>
  <rect x="396" y="0" width="8" height="14" fill="#060312"/>

  <!-- TN abbreviation -->
  <text x="52" y="185" font-family="'Arial Black','Franklin Gothic Heavy',sans-serif" font-size="135" font-weight="900" fill="white" fill-opacity="0.93" letter-spacing="-3">TN</text>
  <text x="54" y="212" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="white" fill-opacity="0.7" letter-spacing="4">TENNESSEE</text>

  <!-- Bottom strip -->
  <rect x="0" y="438" width="800" height="62" fill="rgba(4,2,14,0.9)"/>
  <line x1="0" y1="438" x2="800" y2="438" stroke="rgba(200,150,40,0.4)" stroke-width="1"/>
  <text x="400" y="463" font-family="'Arial Black',sans-serif" font-size="16" font-weight="900" fill="#f5d07a" text-anchor="middle" letter-spacing="2">纳什维尔马拉松</text>
  <text x="400" y="486" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="1.5">NASHVILLE MARATHON · TENNESSEE</text>
</svg>
