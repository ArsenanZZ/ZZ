<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="FACEBOOK integrated enamel plaque cover">
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f1d3a"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="32%" stop-color="#9ca3af"/><stop offset="68%" stop-color="#fff7d6"/><stop offset="100%" stop-color="#5f6874"/></linearGradient>
    <clipPath id="clip"><rect x="45" y="45" width="1110" height="540" rx="25"/></clipPath>
    <filter id="press" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="3" flood-color="#020617" flood-opacity=".8"/></filter>
    <style>
      .title{font-family:Georgia,'Times New Roman',serif;font-weight:900;paint-order:stroke;stroke:#12151c;stroke-width:12px;stroke-linejoin:round;filter:url(#press);letter-spacing:0}
      .rail{font-family:Impact,'Arial Narrow',Arial,sans-serif;font-weight:900;paint-order:stroke;stroke:#151923;stroke-width:7px;stroke-linejoin:round;letter-spacing:1px}
      .field{stroke:#f8e7ba;stroke-width:8;stroke-linejoin:round}
      .route{fill:none;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
      .route-inner{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.74}
    </style>
  </defs>
  <rect width="1200" height="750" fill="#070a11"/>
  <rect x="18" y="18" width="1164" height="714" rx="44" fill="url(#metal)"/>
  <rect x="31" y="31" width="1138" height="688" rx="34" fill="#0a0d14"/>
  <rect x="45" y="45" width="1110" height="540" rx="25" fill="url(#scene)"/>
  <g clip-path="url(#clip)">
    <path d="M45 470 C220 365 370 420 530 330 C705 232 870 260 1155 178 L1155 585 L45 585Z" fill="#050b13" opacity=".26"/>
    <path class="field" d="M90 482 C245 378 410 426 562 322 C725 214 890 246 1110 160 L1110 565 L90 565 Z" fill="#60a5fa" opacity=".42"/>
    <path class="field" d="M335 210 H1015 V455 H335 Z" fill="#22d3ee" opacity=".72"/>
    <path class="route" d="M168 512 C324 404 492 504 650 390 C780 288 905 330 1050 226" stroke="#eff6ff"/>
    <path class="route-inner" d="M168 512 C324 404 492 504 650 390 C780 288 905 330 1050 226" stroke="#fff1c7"/>
    <path d="M45 565 H1155" stroke="#f8e7ba" stroke-width="8" opacity=".95"/>
  </g>
  <text class="title" x="76" y="150" font-size="94" fill="#f9e8bd">FACEBOOK</text>
  <rect x="58" y="604" width="198" height="96" rx="22" fill="#7f1d1d" stroke="url(#metal)" stroke-width="10"/>
  <rect x="286" y="586" width="602" height="116" rx="27" fill="#111827" stroke="url(#metal)" stroke-width="10"/>
  <rect x="918" y="604" width="224" height="96" rx="22" fill="#111827" stroke="url(#metal)" stroke-width="10"/>
  <text class="rail" x="157" y="670" font-size="48" text-anchor="middle" fill="#fff0c2">FB</text>
  <text class="rail" x="587" y="666" font-size="66" text-anchor="middle" fill="#fff0c2">STORIES</text>
  <text class="rail" x="1030" y="668" font-size="46" text-anchor="middle" fill="#fff0c2">POST</text>
</svg>
