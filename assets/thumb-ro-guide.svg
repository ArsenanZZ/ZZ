  </g>

  <g transform="translate(928 92)" opacity=".96">
    <path d="M34 0 H150 L184 34 V116 L150 150 H34 L0 116 V34 Z" fill="#092b54" stroke="url(#metal)" stroke-width="7"/>
    <circle cx="92" cy="56" r="28" fill="#f0d56b" opacity=".9" stroke="#fff" stroke-width="5"/>
    <path d="M76 56 h32 M92 40 v32" stroke="#0c1214" stroke-width="7" stroke-linecap="round" opacity=".54"/>
    <text x="92" y="120" text-anchor="middle" font-size="21" font-weight="900" fill="#fff8df">GUIDE</text>
  </g>


    <g transform="translate(270 164)" filter="url(#softShadow)">
      <path d="M20 245 C158 186 276 210 404 254 C520 294 598 286 720 220" fill="none" stroke="#7ee9ff" stroke-width="34" stroke-linecap="round" opacity=".7"/>
      <path d="M24 255 C164 204 270 220 398 260 C518 298 610 286 716 228" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".8"/>
