        <rect x="0" y="78" width="360" height="240" rx="96" fill="url(#tube)" stroke="#f6ffff" stroke-width="12"/>
        <ellipse cx="38" cy="198" rx="46" ry="112" fill="#77e3ff" opacity=".55" stroke="#ffffff" stroke-width="8"/>
        <ellipse cx="322" cy="198" rx="46" ry="112" fill="#092e4f" opacity=".52" stroke="#ffffff" stroke-width="8"/>
        <rect x="86" y="128" width="196" height="140" rx="22" fill="#e9fdff" opacity=".28" stroke="#ffffff" stroke-width="5"/>
        <path d="M111 144 h152 M111 178 h152 M111 212 h152 M111 246 h152" stroke="#f0d56b" stroke-width="8" stroke-linecap="round" opacity=".9"/>
        <path d="M-104 198 H72 M288 198 H480" stroke="#dffcff" stroke-width="44" stroke-linecap="round"/>
        <path d="M-90 198 H76 M290 198 H472" stroke="#7ee9ff" stroke-width="13" stroke-linecap="round"/>
      </g>
      <circle cx="158" cy="146" r="38" fill="#e9ffff" stroke="#ffffff" stroke-width="7"/>
      <path d="M158 146 l22 -20" stroke="#07578f" stroke-width="7" stroke-linecap="round"/>
      <path d="M637 268 C705 300 760 328 825 302" fill="none" stroke="#f0d56b" stroke-width="24" stroke-linecap="round" opacity=".8"/>
      <path d="M640 269 C707 297 760 318 819 299" fill="none" stroke="#fff5c8" stroke-width="7" stroke-linecap="round"/>
    </g>


  <g filter="url(#softShadow)">
    <path d="M104 524 L252 496 H948 L1096 524 L1052 696 H148 Z" fill="url(#titleGrad)" stroke="url(#metal)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M168 538 C308 510 418 548 560 528 C720 506 832 524 1032 508" fill="none" stroke="#ffffff" stroke-width="5" opacity=".22"/>
    <text x="600" y="566" text-anchor="middle" font-size="66" font-weight="900" fill="#fff" letter-spacing="1">REVERSE</text>
<text x="600" y="634" text-anchor="middle" font-size="66" font-weight="900" fill="#fff" letter-spacing="1">OSMOSIS</text>
    <text x="600" y="646" text-anchor="middle" font-size="23" font-weight="850" fill="#e5fbff" letter-spacing="3">MEMBRANE • STAGES • MAINTENANCE</text>

    <g opacity=".75">
      <path d="M178 650 C250 624 318 674 392 646 C472 616 524 662 602 636 C678 610 724 662 804 638 C882 614 934 654 1020 626" fill="none" stroke="#7ee9ff" stroke-width="8" stroke-linecap="round"/>
      <circle cx="338" cy="646" r="10" fill="#f0d56b" stroke="#fff" stroke-width="4"/>
      <circle cx="862" cy="638" r="10" fill="#f0d56b" stroke="#fff" stroke-width="4"/>
    </g>

  </g>
  <rect x="61" y="59" width="1078" height="632" rx="32" fill="none" stroke="#ffffff" stroke-width="3" opacity=".24"/>
  <rect x="34" y="32" width="1132" height="686" rx="44" fill="none" stroke="#ffffff" stroke-width="4" opacity=".58"/>
</svg>
