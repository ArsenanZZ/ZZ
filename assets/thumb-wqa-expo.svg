<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">WQA 2026 Expo Cover</title>
<desc id="desc">Icon style cover with WQA 2026 title, Miami Beach palm trees, and ocean waves.</desc>
<rect width="1200" height="750" fill="#0c2340"/>

<!-- Top-left Titles -->
<text x="70" y="104" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" fill="#ffffff">WQA 2026</text>
<text x="72" y="150" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#8da4c4">EXPO &amp; CONVENTION OBSERVATION</text>

<!-- Top-right Badge Box -->
<rect x="758" y="62" width="364" height="166" rx="22" fill="#ffffff" stroke="#20242b" stroke-width="8"/>
<text x="790" y="122" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="900" fill="#20242b">WQA Expo</text>
<text x="790" y="182" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#087f69">MIAMI</text>

<!-- Ocean Waves in the bottom -->
<rect x="0" y="610" width="1200" height="140" fill="#051c2c"/>
<path d="M0 610 Q300 560 600 610 T1200 610 L1200 750 L0 750 Z" fill="#051c2c"/>
<path d="M0 650 Q300 610 600 650 T1200 650 L1200 750 L0 750 Z" fill="#0c4a6e"/>
<path d="M0 680 Q300 650 600 680 T1200 680 L1200 750 L0 750 Z" fill="#0284c7"/>

<!-- Stylized Miami Palm Tree -->
<path d="M1000 680 Q970 480 880 340" fill="none" stroke="#20242b" stroke-width="16" stroke-linecap="round"/>
<path d="M1000 680 Q970 480 880 340" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>

<!-- Palm Leaves -->
<path d="M880 340 Q800 300 700 320" fill="none" stroke="#087f69" stroke-width="10" stroke-linecap="round"/>
<path d="M880 340 Q840 250 780 200" fill="none" stroke="#087f69" stroke-width="10" stroke-linecap="round"/>
<path d="M880 340 Q940 240 1020 230" fill="none" stroke="#087f69" stroke-width="10" stroke-linecap="round"/>
<path d="M880 340 Q960 320 1040 350" fill="none" stroke="#087f69" stroke-width="10" stroke-linecap="round"/>
<path d="M880 340 Q880 390 850 460" fill="none" stroke="#087f69" stroke-width="10" stroke-linecap="round"/>

<!-- Big Water Droplet -->
<path d="M220 420 C220 470 170 510 130 510 C90 510 40 470 40 420 C40 370 130 250 130 250 C130 250 220 370 220 420 Z" fill="#38bdf8" stroke="#20242b" stroke-width="8" stroke-linejoin="round"/>
<path d="M100 410 C100 390 130 330 130 330 C130 330 160 390 160 410 C160 430 146 450 130 450 C114 450 100 430 100 410 Z" fill="#ffffff" opacity="0.6"/>

</svg>
