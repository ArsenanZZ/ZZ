<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="RUN50 minimalist enamel plaque cover">
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10213f"/>
      <stop offset="100%" stop-color="#0b4a6f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="34%" stop-color="#9ca3af"/>
      <stop offset="68%" stop-color="#fff7d6"/>
      <stop offset="100%" stop-color="#5b6472"/>
