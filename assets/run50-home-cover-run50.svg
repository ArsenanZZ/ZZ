    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-weight: 900; paint-order: stroke; stroke: #1a1b20; stroke-width: 13px; stroke-linejoin: round; filter: url(#shadow); letter-spacing: 0; }
      .rail { font-family: Impact, 'Arial Narrow', Arial, sans-serif; font-weight: 900; paint-order: stroke; stroke: #171923; stroke-width: 8px; stroke-linejoin: round; letter-spacing: 1px; }
      .route { fill: none; stroke-linecap: round; stroke-linejoin: round; filter: url(#shadow); }
