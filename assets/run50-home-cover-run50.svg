  <path d="M45 515 C210 440 310 590 480 500 C655 408 768 260 1155 325 L1155 585 L45 585Z" fill="#07111c" opacity=".36"/>

    <path d="M585 250 C666 214 759 220 840 264 L925 246 L985 310 L955 380 L824 400 L718 450 L585 424 L478 452 L382 390 L442 318Z" fill="#e8f7ff" opacity=".92"/>
