<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Xiangyang marathon city icon cover</title>
  <desc id="desc">A clean icon-style cover showing Xiangyang city gate, Han River, bridge, route pin, and marathon marks.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7f7"/>
      <stop offset="1" stop-color="#f7f4ef"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#2f855a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- Sun moved to center behind the gate -->
  <circle cx="640" cy="190" r="110" fill="#f2d7a0" opacity="0.62"/>
  <circle cx="240" cy="190" r="78" fill="#dbe8df" opacity="0.92"/>
  <circle cx="145" cy="752" r="112" fill="#e4ecef" opacity="0.9"/>

  <g opacity="0.55" stroke="#cbd5dc" stroke-width="2" fill="none">
    <path d="M120 178h270M1120 806h380M1098 250h210M250 850h420"/>
    <path d="M132 238h168M1188 310h230M1038 746h166"/>
  </g>

  <g transform="translate(180 214)" filter="url(#softShadow)">
    <rect x="0" y="92" width="920" height="470" rx="8" fill="#ffffff"/>
    <path d="M0 92h920v470H0z" fill="#fffdf9"/>
    <path d="M0 92h920v54H0z" fill="#a33a2b"/>
    <path d="M0 510h920v52H0z" fill="#8f3328"/>

    <g fill="#b7892f">
      <rect x="66" y="42" width="92" height="50" rx="4"/>
      <rect x="216" y="42" width="92" height="50" rx="4"/>
      <rect x="366" y="42" width="92" height="50" rx="4"/>
      <rect x="516" y="42" width="92" height="50" rx="4"/>
      <rect x="666" y="42" width="92" height="50" rx="4"/>
      <rect x="816" y="42" width="54" height="50" rx="4"/>
    </g>

    <g fill="#a33a2b">
      <rect x="70" y="155" width="120" height="350" rx="6"/>
      <rect x="730" y="155" width="120" height="350" rx="6"/>
      <rect x="210" y="198" width="500" height="318" rx="6"/>
    </g>

    <path d="M330 516V380c0-78 62-142 140-142s140 64 140 142v136z" fill="#20242b"/>
    <path d="M368 516V389c0-57 45-104 102-104s102 47 102 104v127z" fill="#f7f4ef"/>
    <path d="M398 516V398c0-40 32-73 72-73s72 33 72 73v118z" fill="#20242b"/>

    <g fill="#f7f4ef">
      <rect x="102" y="205" width="56" height="82" rx="4"/>
      <rect x="762" y="205" width="56" height="82" rx="4"/>
      <rect x="252" y="232" width="52" height="66" rx="4"/>
      <rect x="636" y="232" width="52" height="66" rx="4"/>
    </g>
  </g>

  <g transform="translate(0 684)">
    <path d="M0 74c112-46 225-46 338 0s225 46 338 0 225-46 338 0 225 46 338 0 225-46 248-36v278H0z" fill="url(#river)" opacity="0.95"/>
    <path d="M0 116c112-44 225-44 338 0s225 44 338 0 225-44 338 0 225 44 338 0 225-44 248-36" fill="none" stroke="#e8f7f7" stroke-width="12" opacity="0.62"/>
    <path d="M0 180c112-44 225-44 338 0s225 44 338 0 225-44 338 0 225 44 338 0 225-44 248-36" fill="none" stroke="#d8eee7" stroke-width="8" opacity="0.5"/>
  </g>

  <g transform="translate(940 560)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 118c118-112 300-112 418 0" stroke="#20242b" stroke-width="18"/>
    <path d="M44 118c92-76 230-76 330 0" stroke="#ffffff" stroke-width="10"/>
    <path d="M4 118h424" stroke="#20242b" stroke-width="18"/>
    <path d="M76 118v78M154 118v78M232 118v78M310 118v78M388 118v78" stroke="#20242b" stroke-width="12"/>
  </g>

  <g transform="translate(1130 300)" filter="url(#softShadow)">
    <path d="M178 0c84 0 152 68 152 152 0 122-152 286-152 286S26 274 26 152C26 68 94 0 178 0z" fill="#ffffff"/>
    <path d="M178 40c62 0 112 50 112 112 0 89-112 210-112 210S66 241 66 152C66 90 116 40 178 40z" fill="#0e7490"/>
    <circle cx="178" cy="152" r="56" fill="#ffffff"/>
    <path d="M150 176l30-90 30 90h-24l-6-23h-30l-6 23z" fill="#a33a2b"/>
  </g>



  <g transform="translate(1012 808)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 72c34-34 70-46 108-36 50 13 84-2 122-38" stroke-width="14"/>
    <circle cx="42" cy="72" r="12" fill="#ffffff" stroke="none"/>
    <circle cx="150" cy="36" r="12" fill="#ffffff" stroke="none"/>
    <circle cx="272" cy="0" r="12" fill="#ffffff" stroke="none"/>
  </g>

  <g transform="translate(93 139)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#20242b">XIANGYANG</text>
    <text x="0" y="61" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#a33a2b">CITY · RIVER · MARATHON</text>
  </g>

  <!-- RunCN Badge to unify style -->
  <rect x="1053" y="83" width="440" height="195" rx="29" fill="#ffffff" stroke="#20242b" stroke-width="11"/>
  <text x="1093" y="152" font-family="Arial, sans-serif" font-size="45" font-weight="900" fill="#20242b">RunCN #1</text>
  <text x="1093" y="224" font-family="Arial, sans-serif" font-size="59" font-weight="900" fill="#cc0000">XIANGYANG</text>
</svg>
