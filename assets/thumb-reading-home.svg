<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">READING STUDY</title>
  <desc id="desc">Modern enamel plaque cover for reading and study hub.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6d4"/>
      <stop offset="18%" stop-color="#9c7a3d"/>
      <stop offset="36%" stop-color="#f9f2df"/>
      <stop offset="58%" stop-color="#706041"/>
      <stop offset="80%" stop-color="#f6f7f4"/>
      <stop offset="100%" stop-color="#886b36"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#281224"/>
      <stop offset="56%" stop-color="#9d3e50"/>
      <stop offset="100%" stop-color="#2b253c"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8d2f42"/>
      <stop offset="100%" stop-color="#50315e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#f5c7ca"/>
      <stop offset="100%" stop-color="#a24351"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6ffff"/>
      <stop offset="45%" stop-color="#f5c7ca"/>
      <stop offset="100%" stop-color="#a24351"/>
    </linearGradient>
    <radialGradient id="wafer" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#f5c7ca"/>
      <stop offset="58%" stop-color="#6a4a86"/>
      <stop offset="100%" stop-color="#a24351"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".34"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity=".24"/>
    </filter>
    <pattern id="pinstripe" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <path d="M0 0 H44" stroke="#ffffff" stroke-width="3" opacity=".08"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
  </style>
  <rect width="1200" height="750" fill="#090f12"/>
  <rect x="26" y="24" width="1148" height="702" rx="48" fill="url(#metal)" filter="url(#shadow)"/>
  <rect x="42" y="40" width="1116" height="670" rx="40" fill="#111817"/>
  <rect x="61" y="59" width="1078" height="632" rx="32" fill="url(#bg)"/>
  <rect x="61" y="59" width="1078" height="632" rx="32" fill="url(#pinstripe)"/>
  <path d="M92 102 C248 52 394 88 548 126 C734 172 872 128 1100 80 L1100 260 C912 302 754 276 586 234 C382 184 224 202 92 260 Z" fill="#ffffff" opacity=".08"/>
  <path d="M82 468 C214 418 354 484 496 444 C664 396 836 432 1114 348 L1114 672 H82 Z" fill="#000000" opacity=".14"/>

  <g transform="translate(90 86)" filter="url(#softShadow)">
    <path d="M0 0 H246 L276 36 V144 L246 180 H0 Z" fill="#893141" stroke="url(#metal)" stroke-width="9"/>
    <text x="132" y="116" text-anchor="middle" font-size="62" font-weight="950" fill="#fff8df" stroke="#0b1114" stroke-width="4" paint-order="stroke">READ</text>
  </g>

  <g transform="translate(928 92)" opacity=".96">
    <path d="M34 0 H150 L184 34 V116 L150 150 H34 L0 116 V34 Z" fill="#3a233b" stroke="url(#metal)" stroke-width="7"/>
    <circle cx="92" cy="56" r="28" fill="#e8c66b" opacity=".9" stroke="#fff" stroke-width="5"/>
    <path d="M76 56 h32 M92 40 v32" stroke="#0c1214" stroke-width="7" stroke-linecap="round" opacity=".54"/>
    <text x="92" y="120" text-anchor="middle" font-size="21" font-weight="900" fill="#fff8df">HUB</text>
  </g>


    <g transform="translate(300 128)" filter="url(#softShadow)">

      <path d="M120 156 C190 116 256 124 328 168 v250 C252 378 190 372 120 414 Z" fill="#fff1dc" stroke="#ffffff" stroke-width="9"/><path d="M328 168 C404 124 472 116 546 156 v258 C474 372 404 378 328 418 Z" fill="#f9dfc3" stroke="#ffffff" stroke-width="9"/><path d="M328 170 v246" stroke="#e8c66b" stroke-width="7" opacity=".75"/><path d="M166 210 h110 M166 246 h92 M378 210 h120 M378 246 h82" stroke="#8d2f42" stroke-width="7" stroke-linecap="round" opacity=".32"/>
      <rect x="456" y="266" width="134" height="170" rx="18" fill="#e8c66b" stroke="#ffffff" stroke-width="8" transform="rotate(10 523 351)"/>
      <path d="M110 450 C216 406 312 470 420 424 C496 392 560 408 662 372" fill="none" stroke="#f5c7ca" stroke-width="13" stroke-linecap="round" opacity=".75"/>
    </g>


  <g filter="url(#softShadow)">
    <path d="M104 524 L252 496 H948 L1096 524 L1052 696 H148 Z" fill="url(#titleGrad)" stroke="url(#metal)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M168 538 C308 510 418 548 560 528 C720 506 832 524 1032 508" fill="none" stroke="#ffffff" stroke-width="5" opacity=".22"/>
    <text x="600" y="566" text-anchor="middle" font-size="66" font-weight="900" fill="#fff" letter-spacing="1">READING</text>
<text x="600" y="634" text-anchor="middle" font-size="66" font-weight="900" fill="#fff" letter-spacing="1">STUDY</text>
    <text x="600" y="646" text-anchor="middle" font-size="23" font-weight="850" fill="#fff0d4" letter-spacing="3">NOTES • BOOKS • CARDS</text>

        <g opacity=".78">
          <rect x="190" y="626" width="70" height="44" rx="8" fill="#e8c66b" stroke="#fff" stroke-width="4" transform="rotate(-8 225 648)"/>
          <rect x="284" y="628" width="70" height="44" rx="8" fill="#f5c7ca" stroke="#fff" stroke-width="4" transform="rotate(6 319 650)"/>
          <rect x="850" y="626" width="70" height="44" rx="8" fill="#e8c66b" stroke="#fff" stroke-width="4" transform="rotate(8 885 648)"/>
          <path d="M386 652 h112 M702 652 h112" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"/>
        </g>

  </g>
  <rect x="61" y="59" width="1078" height="632" rx="32" fill="none" stroke="#ffffff" stroke-width="3" opacity=".24"/>
  <rect x="34" y="32" width="1132" height="686" rx="44" fill="none" stroke="#ffffff" stroke-width="4" opacity=".58"/>
</svg>
