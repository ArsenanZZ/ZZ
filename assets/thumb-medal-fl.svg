<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky-fl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2a4a"/>
      <stop offset="35%" stop-color="#c84878"/>
      <stop offset="65%" stop-color="#e87040"/>
      <stop offset="100%" stop-color="#f0a040"/>
    </linearGradient>
    <linearGradient id="ocean-fl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d7a8a"/>
      <stop offset="100%" stop-color="#065060"/>
    </linearGradient>
    <linearGradient id="gold-fl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9922a"/>
      <stop offset="45%" stop-color="#f5d07a"/>
      <stop offset="100%" stop-color="#b07820"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky-fl)"/>

  <!-- Sun -->
  <circle cx="680" cy="110" r="55" fill="#ffcc20" opacity="0.9"/>
  <circle cx="680" cy="110" r="45" fill="#ffd840" opacity="0.95"/>

  <!-- Ocean -->
  <rect x="0" y="360" width="800" height="140" fill="url(#ocean-fl)"/>
  <path d="M0,368 Q200,355 400,363 Q600,371 800,358 L800,500 L0,500Z" fill="#065060" opacity="0.7"/>
  <!-- Wave lines -->
  <path d="M0,385 Q100,375 200,382 Q300,389 400,380 Q500,371 600,378 Q700,385 800,376" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <path d="M0,400 Q100,392 200,397 Q300,402 400,395 Q500,388 600,393 Q700,398 800,391" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Sand strip -->
  <rect x="0" y="355" width="800" height="18" fill="#d4b060" opacity="0.7"/>

  <!-- Art Deco hotel (center) -->
  <!-- Main tower -->
  <rect x="340" y="185" width="120" height="185" fill="#f5f0e0"/>
  <!-- Stepped crown -->
  <rect x="355" y="160" width="90" height="35" fill="#f5f0e0"/>
  <rect x="368" y="145" width="64" height="25" fill="#f5f0e0"/>
  <rect x="380" y="133" width="40" height="18" fill="#f5f0e0"/>
  <rect x="390" y="120" width="20" height="18" fill="#e8e0cc"/>
  <!-- Hotel facade windows/stripes (teal) -->
  <rect x="352" y="220" width="10" height="100" fill="#1a8a8a" opacity="0.5"/>
  <rect x="378" y="220" width="10" height="100" fill="#1a8a8a" opacity="0.5"/>
  <rect x="412" y="220" width="10" height="100" fill="#1a8a8a" opacity="0.5"/>
  <rect x="438" y="220" width="10" height="100" fill="#1a8a8a" opacity="0.5"/>
  <!-- Hotel entry arch -->
  <path d="M378,370 L378,325 Q400,308 422,325 L422,370 Z" fill="#d4b060" opacity="0.6"/>
  <!-- Side wings -->
  <rect x="270" y="230" width="75" height="140" fill="#ebe6d0"/>
  <rect x="455" y="230" width="75" height="140" fill="#ebe6d0"/>

  <!-- Palm trees -->
  <!-- Left palm -->
  <path d="M140,380 C142,330 136,280 140,245" stroke="#5a3a18" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M140,245 Q95,200 55,215" stroke="#2a6a18" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M140,245 Q105,195 115,155" stroke="#2a6a18" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M140,245 Q155,185 195,175" stroke="#2a6a18" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M140,245 Q170,205 200,220" stroke="#2a6a18" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M140,245 Q125,200 95,230" stroke="#2a6a18" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Coconuts -->
  <circle cx="128" cy="253" r="8" fill="#8B5a10"/>
  <circle cx="148" cy="258" r="7" fill="#7a4e0c"/>

  <!-- Right palm -->
  <path d="M660,380 C658,325 664,275 660,240" stroke="#5a3a18" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M660,240 Q700,195 740,208" stroke="#2a6a18" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M660,240 Q695,190 685,150" stroke="#2a6a18" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M660,240 Q645,185 605,178" stroke="#2a6a18" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M660,240 Q630,205 600,220" stroke="#2a6a18" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="672" cy="248" r="8" fill="#8B5a10"/>
  <circle cx="652" cy="252" r="7" fill="#7a4e0c"/>

  <!-- Gold medal border -->
  <rect x="7" y="7" width="786" height="486" rx="13" ry="13" fill="none" stroke="url(#gold-fl)" stroke-width="6"/>
  <rect x="16" y="16" width="768" height="468" rx="10" ry="10" fill="none" stroke="rgba(200,150,40,0.3)" stroke-width="1.5"/>
  <circle cx="28" cy="28" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>
  <circle cx="772" cy="28" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>
  <circle cx="28" cy="472" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>
  <circle cx="772" cy="472" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>

  <!-- Ribbon -->
  <path d="M376,0 L424,0 L424,38 L400,50 L376,38 Z" fill="#085868"/>
  <path d="M382,0 L418,0 L418,34 L400,44 L382,34 Z" fill="#107888"/>
  <circle cx="400" cy="7" r="5" fill="#c9922a" opacity="0.9"/>
  <rect x="396" y="0" width="8" height="14" fill="#065060"/>

  <!-- FL abbreviation -->
  <text x="55" y="185" font-family="'Arial Black','Franklin Gothic Heavy',sans-serif" font-size="135" font-weight="900" fill="white" fill-opacity="0.93" letter-spacing="-3">FL</text>
  <text x="57" y="212" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="white" fill-opacity="0.7" letter-spacing="5">FLORIDA</text>

  <!-- Bottom strip -->
  <rect x="0" y="438" width="800" height="62" fill="rgba(4,25,35,0.85)"/>
  <line x1="0" y1="438" x2="800" y2="438" stroke="rgba(200,150,40,0.4)" stroke-width="1"/>
  <text x="400" y="463" font-family="'Arial Black',sans-serif" font-size="16" font-weight="900" fill="#f5d07a" text-anchor="middle" letter-spacing="2">迈阿密马拉松</text>
  <text x="400" y="486" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="1.5">MIAMI MARATHON · FLORIDA</text>
</svg>
