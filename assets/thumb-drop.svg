  <g filter="url(#softShadow)">
    <path d="M104 524 L252 496 H948 L1096 524 L1052 696 H148 Z" fill="url(#titleGrad)" stroke="url(#metal)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M168 538 C308 510 418 548 560 528 C720 506 832 524 1032 508" fill="none" stroke="#ffffff" stroke-width="5" opacity=".22"/>
    <text x="600" y="566" text-anchor="middle" font-size="66" font-weight="900" fill="#fff" letter-spacing="1">SMART WATER</text>
<text x="600" y="634" text-anchor="middle" font-size="66" font-weight="900" fill="#fff" letter-spacing="1">PLATFORM</text>
    <text x="600" y="646" text-anchor="middle" font-size="23" font-weight="850" fill="#ecfffb" letter-spacing="3">CONTROLS • SENSORS • FIELD REPORT</text>

        <g stroke="#89f5ff" stroke-width="5" stroke-linecap="round" opacity=".7">
