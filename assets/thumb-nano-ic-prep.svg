<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">NANO IC STUDY</title>
  <desc id="desc">Modern enamel plaque cover for nano-scale IC manufacturing study notes.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6d4"/>
      <stop offset="18%" stop-color="#9c7a3d"/>
      <stop offset="36%" stop-color="#f9f2df"/>
      <stop offset="58%" stop-color="#706041"/>
      <stop offset="80%" stop-color="#f6f7f4"/>
      <stop offset="100%" stop-color="#886b36"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1133"/>
      <stop offset="56%" stop-color="#214eb9"/>
      <stop offset="100%" stop-color="#42206d"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#263e91"/>
      <stop offset="100%" stop-color="#4a297d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#79f1ff"/>
      <stop offset="100%" stop-color="#245dd6"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6ffff"/>
      <stop offset="45%" stop-color="#79f1ff"/>
      <stop offset="100%" stop-color="#245dd6"/>
    </linearGradient>
    <radialGradient id="wafer" cx="42%" cy="32%" r="68%">
