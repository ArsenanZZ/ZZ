    <path d="M168 538 C308 510 418 548 560 528 C720 506 832 524 1032 508" fill="none" stroke="#ffffff" stroke-width="5" opacity=".22"/>
    <text x="600" y="566" text-anchor="middle" font-size="66" font-weight="900" fill="#fff" letter-spacing="1">NANO IC</text>
<text x="600" y="634" text-anchor="middle" font-size="66" font-weight="900" fill="#fff" letter-spacing="1">STUDY</text>
    <text x="600" y="646" text-anchor="middle" font-size="23" font-weight="850" fill="#e8fbff" letter-spacing="3">EQUIPMENT • PROCESS FLOW</text>

