<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">NSF ANSI Drinking Water Standards Guide cover</title>
  <desc id="desc">Water standards cover with NSF ANSI label, certified check mark, and standard numbers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#063b57"/>
      <stop offset="52%" stop-color="#087f69"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#03251f" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <path d="M0 590 C180 550 300 650 480 610 C650 570 780 530 960 590 C1080 630 1140 640 1200 610 L1200 750 L0 750 Z" fill="#052e45" opacity=".56"/>
  <path d="M0 645 C220 585 360 710 580 650 C770 598 910 600 1200 680 L1200 750 L0 750 Z" fill="#0ea5e9" opacity=".26"/>

  <g transform="translate(80 78)">
    <text x="0" y="68" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" fill="#ffffff">NSF/ANSI</text>
    <text x="4" y="122" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#b7fff2">DRINKING WATER STANDARDS</text>
    <text x="4" y="172" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#d7f8ff">42 · 53 · 58 · 401 · 372</text>
  </g>

  <g transform="translate(780 84)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="210" rx="28" fill="#ffffff"/>
    <circle cx="92" cy="106" r="58" fill="#087f69"/>
    <path d="M63 106 L84 127 L126 77" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="178" y="92" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#17201c">STANDARD</text>
    <text x="178" y="136" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#087f69">GUIDE</text>
  </g>

  <g transform="translate(190 260)" filter="url(#shadow)">
    <path d="M230 0 C230 0 410 224 410 358 C410 480 318 565 230 565 C142 565 50 480 50 358 C50 224 230 0 230 0 Z" fill="url(#drop)" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
    <path d="M178 338 C178 286 230 190 230 190 C230 190 282 286 282 338 C282 390 260 426 230 426 C200 426 178 390 178 338 Z" fill="#ffffff" opacity=".62"/>
  </g>

  <g transform="translate(620 354)">
    <rect x="0" y="0" width="430" height="56" rx="12" fill="#ffffff" opacity=".92"/>
    <rect x="0" y="80" width="360" height="56" rx="12" fill="#ffffff" opacity=".78"/>
    <rect x="0" y="160" width="292" height="56" rx="12" fill="#ffffff" opacity=".66"/>
    <text x="24" y="37" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900" fill="#0f766e">Taste, odor, particulates</text>
    <text x="24" y="117" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900" fill="#0f766e">Health contaminants</text>
    <text x="24" y="197" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900" fill="#0f766e">RO, emerging compounds, lead</text>
  </g>
</svg>
