<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">NSF/ANSI STANDARDS</title>
  <desc id="desc">Modern enamel plaque cover for NSF ANSI drinking-water standards.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6d4"/>
      <stop offset="18%" stop-color="#9c7a3d"/>
      <stop offset="36%" stop-color="#f9f2df"/>
      <stop offset="58%" stop-color="#706041"/>
      <stop offset="80%" stop-color="#f6f7f4"/>
      <stop offset="100%" stop-color="#886b36"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17251d"/>
      <stop offset="56%" stop-color="#5f833e"/>
      <stop offset="100%" stop-color="#193328"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#526d31"/>
      <stop offset="100%" stop-color="#1d5c4f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#c8f299"/>
      <stop offset="100%" stop-color="#7fae52"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6ffff"/>
      <stop offset="45%" stop-color="#c8f299"/>
      <stop offset="100%" stop-color="#7fae52"/>
    </linearGradient>
    <radialGradient id="wafer" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#c8f299"/>
      <stop offset="58%" stop-color="#246850"/>
      <stop offset="100%" stop-color="#7fae52"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".34"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity=".24"/>
    </filter>
    <pattern id="pinstripe" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <path d="M0 0 H44" stroke="#ffffff" stroke-width="3" opacity=".08"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
  </style>
  <rect width="1200" height="750" fill="#090f12"/>
  <rect x="26" y="24" width="1148" height="702" rx="48" fill="url(#metal)" filter="url(#shadow)"/>
  <rect x="42" y="40" width="1116" height="670" rx="40" fill="#111817"/>
  <rect x="61" y="59" width="1078" height="632" rx="32" fill="url(#bg)"/>
  <rect x="61" y="59" width="1078" height="632" rx="32" fill="url(#pinstripe)"/>
  <path d="M92 102 C248 52 394 88 548 126 C734 172 872 128 1100 80 L1100 260 C912 302 754 276 586 234 C382 184 224 202 92 260 Z" fill="#ffffff" opacity=".08"/>
  <path d="M82 468 C214 418 354 484 496 444 C664 396 836 432 1114 348 L1114 672 H82 Z" fill="#000000" opacity=".14"/>

  <g transform="translate(90 86)" filter="url(#softShadow)">
    <path d="M0 0 H246 L276 36 V144 L246 180 H0 Z" fill="#536e33" stroke="url(#metal)" stroke-width="9"/>
    <text x="132" y="116" text-anchor="middle" font-size="78" font-weight="950" fill="#fff8df" stroke="#0b1114" stroke-width="4" paint-order="stroke">NSF</text>
  </g>

  <g transform="translate(928 92)" opacity=".96">
    <path d="M34 0 H150 L184 34 V116 L150 150 H34 L0 116 V34 Z" fill="#263f2e" stroke="url(#metal)" stroke-width="7"/>
    <circle cx="92" cy="56" r="28" fill="#d8aa4a" opacity=".9" stroke="#fff" stroke-width="5"/>
    <path d="M76 56 h32 M92 40 v32" stroke="#0c1214" stroke-width="7" stroke-linecap="round" opacity=".54"/>
    <text x="92" y="120" text-anchor="middle" font-size="21" font-weight="900" fill="#fff8df">ANSI</text>
  </g>


    <g transform="translate(355 120)" filter="url(#softShadow)">
      <rect x="70" y="30" width="360" height="430" rx="28" fill="#f6fbf1" stroke="#ffffff" stroke-width="10"/>
      <rect x="112" y="88" width="276" height="44" rx="12" fill="#d8aa4a" opacity=".85"/>
      <rect x="112" y="166" width="94" height="24" rx="10" fill="#7fae52" opacity=".5"/>
      <rect x="112" y="222" width="228" height="24" rx="10" fill="#7fae52" opacity=".42"/>
      <rect x="112" y="278" width="176" height="24" rx="10" fill="#7fae52" opacity=".38"/>
      <circle cx="398" cy="332" r="106" fill="#526d31" stroke="#ffffff" stroke-width="9"/>
      <circle cx="398" cy="332" r="74" fill="none" stroke="#c8f299" stroke-width="8" opacity=".8"/>
      <path d="M354 333 l29 31 l63 -79" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 270 C94 214 158 274 250 238 C356 197 445 232 546 172" fill="none" stroke="#c8f299" stroke-width="13" stroke-linecap="round"/>
      <circle cx="74" cy="248" r="18" fill="#d8aa4a"/>
      <circle cx="224" cy="242" r="13" fill="#ffffff"/>
      <circle cx="494" cy="194" r="18" fill="#d8aa4a"/>
    </g>


  <g filter="url(#softShadow)">
    <path d="M104 524 L252 496 H948 L1096 524 L1052 696 H148 Z" fill="url(#titleGrad)" stroke="url(#metal)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M168 538 C308 510 418 548 560 528 C720 506 832 524 1032 508" fill="none" stroke="#ffffff" stroke-width="5" opacity=".22"/>
    <text x="600" y="566" text-anchor="middle" font-size="66" font-weight="900" fill="#fff" letter-spacing="1">NSF/ANSI</text>
<text x="600" y="634" text-anchor="middle" font-size="66" font-weight="900" fill="#fff" letter-spacing="1">STANDARDS</text>
    <text x="600" y="646" text-anchor="middle" font-size="23" font-weight="850" fill="#f8f5d6" letter-spacing="3">DRINKING WATER • ENDPOINTS</text>

    <g opacity=".75">
      <path d="M178 650 C250 624 318 674 392 646 C472 616 524 662 602 636 C678 610 724 662 804 638 C882 614 934 654 1020 626" fill="none" stroke="#c8f299" stroke-width="8" stroke-linecap="round"/>
      <circle cx="338" cy="646" r="10" fill="#d8aa4a" stroke="#fff" stroke-width="4"/>
      <circle cx="862" cy="638" r="10" fill="#d8aa4a" stroke="#fff" stroke-width="4"/>
    </g>

  </g>
  <rect x="61" y="59" width="1078" height="632" rx="32" fill="none" stroke="#ffffff" stroke-width="3" opacity=".24"/>
  <rect x="34" y="32" width="1132" height="686" rx="44" fill="none" stroke="#ffffff" stroke-width="4" opacity=".58"/>
</svg>
