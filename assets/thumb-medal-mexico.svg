    <line x1="480" y1="78" x2="472" y2="68" stroke="#f5c010" stroke-width="3.5" opacity="0.6"/>
    <line x1="468" y1="108" x2="456" y2="108" stroke="#f5c010" stroke-width="3.5" opacity="0.6"/>
