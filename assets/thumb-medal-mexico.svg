    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a0808"/><stop offset="35%" stop-color="#8a2010"/><stop offset="65%" stop-color="#e05018"/><stop offset="100%" stop-color="#f0a020"/></linearGradient>
