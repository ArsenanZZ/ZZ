<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky-mx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="35%" stop-color="#8a2010"/>
      <stop offset="65%" stop-color="#e05018"/>
      <stop offset="100%" stop-color="#f0a020"/>
    </linearGradient>
    <linearGradient id="gold-mx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9922a"/>
      <stop offset="45%" stop-color="#f5d07a"/>
      <stop offset="100%" stop-color="#b07820"/>
    </linearGradient>
    <linearGradient id="pyramid-mx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c89040"/>
      <stop offset="100%" stop-color="#8a6020"/>
    </linearGradient>
  </defs>

  <!-- Vivid sunset sky -->
  <rect width="800" height="500" fill="url(#sky-mx)"/>

  <!-- Sun disk (Aztec-inspired) -->
  <circle cx="680" cy="95" r="50" fill="#f5c010" opacity="0.9"/>
  <circle cx="680" cy="95" r="42" fill="#e8a008" opacity="0.85"/>
  <!-- Sun rays -->
  <line x1="680" y1="35" x2="680" y2="20" stroke="#f5c010" stroke-width="4" opacity="0.6"/>
  <line x1="720" y1="55" x2="730" y2="42" stroke="#f5c010" stroke-width="4" opacity="0.6"/>
  <line x1="738" y1="95" x2="755" y2="95" stroke="#f5c010" stroke-width="4" opacity="0.6"/>
  <line x1="720" y1="135" x2="730" y2="148" stroke="#f5c010" stroke-width="4" opacity="0.6"/>
  <line x1="640" y1="55" x2="630" y2="42" stroke="#f5c010" stroke-width="4" opacity="0.6"/>
  <line x1="622" y1="95" x2="605" y2="95" stroke="#f5c010" stroke-width="4" opacity="0.6"/>
  <line x1="640" y1="135" x2="630" y2="148" stroke="#f5c010" stroke-width="4" opacity="0.6"/>

  <!-- Ground -->
  <rect x="0" y="390" width="800" height="110" fill="#2a1808"/>
  <rect x="0" y="383" width="800" height="12" fill="#3a2210"/>

  <!-- Pyramid of the Sun (Teotihuacan, main) -->
  <!-- Pyramid base (largest) -->
  <polygon points="200,390 400,175 600,390" fill="url(#pyramid-mx)"/>
  <!-- Pyramid level 1 -->
  <polygon points="228,390 400,200 572,390" fill="#b87a28"/>
  <!-- Pyramid terraced levels -->
  <rect x="240" y="367" width="320" height="28" fill="#a87020"/>
  <rect x="265" y="340" width="270" height="32" fill="#b87a28"/>
  <rect x="292" y="311" width="216" height="34" fill="#a87020"/>
  <rect x="320" y="280" width="160" height="36" fill="#b87a28"/>
  <rect x="350" y="248" width="100" height="38" fill="#a87020"/>
  <rect x="375" y="218" width="50" height="35" fill="#b87a28"/>
  <!-- Temple on top -->
  <rect x="382" y="196" width="36" height="28" fill="#c89040"/>
  <rect x="379" y="190" width="42" height="10" fill="#d4a050"/>
  <!-- Pyramid shadow/highlight -->
  <polygon points="400,175 600,390 500,390" fill="rgba(0,0,0,0.2)"/>

  <!-- Small pyramid right (Pyramid of the Moon) -->
  <polygon points="620,390 720,260 820,390" fill="#a07020"/>
  <rect x="640" y="368" width="160" height="22" fill="#906018"/>
  <rect x="655" y="348" width="130" height="24" fill="#a07020"/>
  <rect x="672" y="326" width="96" height="26" fill="#906018"/>
  <rect x="691" y="302" width="58" height="28" fill="#a07020"/>

  <!-- Cathedral dome (Metropolitan Cathedral Mexico City) -->
  <rect x="50" y="225" width="160" height="175" fill="#e8d8b8"/>
  <!-- Cathedral twin towers -->
  <rect x="52" y="155" width="38" height="85" fill="#e0d0b0"/>
  <rect x="170" y="155" width="38" height="85" fill="#e0d0b0"/>
  <!-- Tower tops -->
  <path d="M52,155 L71,120 L90,155 Z" fill="#d8c8a8"/>
  <path d="M170,155 L189,120 L208,155 Z" fill="#d8c8a8"/>
  <rect x="68" y="108" width="6" height="16" fill="#c0b080"/>
  <rect x="186" y="108" width="6" height="16" fill="#c0b080"/>
  <!-- Cathedral dome (center) -->
  <ellipse cx="130" cy="225" rx="38" ry="12" fill="#d8c8a0"/>
  <path d="M94,225 Q130,170 166,225 Z" fill="#d0c098"/>
  <path d="M100,225 Q130,178 160,225" fill="none" stroke="#c0b088" stroke-width="2"/>
  <rect x="124" y="168" width="12" height="20" fill="#c8b880"/>
  <circle cx="130" cy="165" r="8" fill="#d4c090"/>
  <!-- Cathedral facade details -->
  <rect x="108" y="320" width="44" height="80" fill="#c0b080" opacity="0.5"/>
  <path d="M108,320 Q130,298 152,320" fill="#c8b880" opacity="0.6"/>
  <rect x="60" y="270" width="22" height="35" rx="11" fill="#8a7040" opacity="0.4"/>
  <rect x="178" y="270" width="22" height="35" rx="11" fill="#8a7040" opacity="0.4"/>

  <!-- Marigold flowers (cempasúchil) -->
  <!-- Left cluster -->
  <circle cx="90" cy="400" r="14" fill="#e88010"/>
  <circle cx="75" cy="408" r="12" fill="#f0a020"/>
  <circle cx="105" cy="408" r="11" fill="#e87010"/>
  <circle cx="88" cy="418" r="10" fill="#f0a020"/>
  <circle cx="90" cy="400" r="6" fill="#ffd040"/>
  <!-- Right cluster -->
  <circle cx="685" cy="402" r="14" fill="#e88010"/>
  <circle cx="670" cy="410" r="12" fill="#f0a020"/>
  <circle cx="700" cy="408" r="11" fill="#e87010"/>
  <circle cx="684" cy="420" r="10" fill="#f0a020"/>
  <circle cx="685" cy="402" r="6" fill="#ffd040"/>
  <!-- Leaves -->
  <path d="M90,414 Q65,430 55,445" stroke="#2a6010" stroke-width="3" fill="none"/>
  <path d="M90,414 Q105,435 110,448" stroke="#2a6010" stroke-width="3" fill="none"/>
  <path d="M685,416 Q660,432 650,447" stroke="#2a6010" stroke-width="3" fill="none"/>
  <path d="M685,416 Q710,436 718,448" stroke="#2a6010" stroke-width="3" fill="none"/>

  <!-- Mexican flag colors stripe at top -->
  <rect x="0" y="0" width="267" height="18" fill="#006847" opacity="0.8"/>
  <rect x="267" y="0" width="266" height="18" fill="white" opacity="0.8"/>
  <rect x="533" y="0" width="267" height="18" fill="#ce1126" opacity="0.8"/>

  <!-- Gold medal border -->
  <rect x="7" y="7" width="786" height="486" rx="13" ry="13" fill="none" stroke="url(#gold-mx)" stroke-width="6"/>
  <rect x="16" y="16" width="768" height="468" rx="10" ry="10" fill="none" stroke="rgba(200,150,40,0.3)" stroke-width="1.5"/>
  <circle cx="28" cy="28" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>
  <circle cx="772" cy="28" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>
  <circle cx="28" cy="472" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>
  <circle cx="772" cy="472" r="5" fill="none" stroke="rgba(200,150,40,0.55)" stroke-width="2"/>

  <!-- Ribbon -->
  <path d="M376,0 L424,0 L424,38 L400,50 L376,38 Z" fill="#005030"/>
  <path d="M382,0 L418,0 L418,34 L400,44 L382,34 Z" fill="#006847"/>
  <circle cx="400" cy="7" r="5" fill="#c9922a" opacity="0.9"/>
  <rect x="396" y="0" width="8" height="14" fill="#004028"/>

  <!-- MX text -->
  <text x="48" y="180" font-family="'Arial Black','Franklin Gothic Heavy',sans-serif" font-size="120" font-weight="900" fill="white" fill-opacity="0.92" letter-spacing="-2">MX</text>
  <text x="50" y="208" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="white" fill-opacity="0.65" letter-spacing="3">MÉXICO</text>

  <!-- Bottom strip -->
  <rect x="0" y="438" width="800" height="62" fill="rgba(12,5,2,0.88)"/>
  <line x1="0" y1="438" x2="800" y2="438" stroke="rgba(200,150,40,0.4)" stroke-width="1"/>
  <text x="400" y="463" font-family="'Arial Black',sans-serif" font-size="16" font-weight="900" fill="#f5d07a" text-anchor="middle" letter-spacing="2">墨西哥城马拉松</text>
  <text x="400" y="486" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="1.5">MEXICO CITY MARATHON · MÉXICO</text>
</svg>
