    <text x="256" y="168" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white" fill-opacity="0.8" stroke="#2a0808" stroke-width="1" paint-order="stroke" letter-spacing="3">MÉXICO</text>
