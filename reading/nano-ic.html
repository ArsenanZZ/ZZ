<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nano-Scale Manufacturing Equipment Illustrated Handbook - Reader</title>
<style>
:root {
  --bg: #f2f0eb;
  --ink: #1a1a1a;
  --muted: #6b6b6b;
  --line: #ddd;
  --green: #1a5c48;
  --green-light: #e8f4f0;
  --shadow: 0 4px 20px rgba(0,0,0,0.10);
  --page-width: 860px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.6;}

/* topbar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:10px 24px;background:rgba(242,240,235,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;min-width:0;}
.mark{width:34px;height:34px;border-radius:8px;background:var(--green);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0;}
.brand-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn{min-height:32px;display:inline-flex;align-items:center;padding:5px 12px;
  border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
  font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;}
.btn:hover{background:var(--green-light);border-color:var(--green);}
.btn.active{background:var(--green-light);border-color:var(--green);color:var(--green);}

/* layout */
.layout{display:grid;grid-template-columns:260px 1fr;gap:20px;
  padding:20px 20px 60px;max-width:1300px;margin:0 auto;}

/* sidebar */
.sidebar{position:sticky;top:56px;align-self:start;max-height:calc(100vh - 72px);
  overflow-y:auto;padding:14px;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);}
.sidebar h3{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:1px;
  text-transform:uppercase;margin-bottom:10px;}
.ch-btn{display:block;width:100%;text-align:left;padding:7px 10px;
  border:none;border-radius:6px;background:transparent;cursor:pointer;
  font-size:13px;line-height:1.3;color:var(--ink);}
.ch-btn:hover{background:var(--green-light);}
.ch-btn.active{background:var(--green-light);color:var(--green);font-weight:600;}
.ch-btn small{display:block;font-size:11px;color:var(--muted);margin-top:1px;}

/* reader */
.reader{min-width:0;}
.toolbar{position:sticky;top:56px;z-index:40;display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:8px 12px;margin-bottom:14px;
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);}
.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.range-label{font-size:13px;color:var(--muted);}
.page-jump{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
.page-jump input{width:70px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;
  font-size:13px;text-align:center;}
.width-ctrl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.width-ctrl input{width:100px;accent-color:var(--green);}

/* pages */
.pages{display:flex;flex-direction:column;gap:18px;align-items:center;}
.page-wrap{width:min(100%, var(--page-width));scroll-margin-top:130px;}
.page-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;}
.page-wrap img{display:block;width:100%;height:auto;border-radius:6px;
  border:1px solid #ccc;box-shadow:var(--shadow);background:#fff;}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;max-height:none;}
}
@media(max-width:600px){
  .topbar{flex-wrap:wrap;}
  .toolbar{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">IC</div>
    <span class="brand-text">纳米集成电路制造工艺 · 张汝京编著</span>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <a class="btn" href="hub.html">Reading Hub</a>
    <a class="btn" href="nano-ic-pages/">Page Directory</a>
    <a class="btn" href="../index.html">← 首页</a>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h3>章节导航</h3>
    <div id="chList"></div>
  </aside>

  <section class="reader">
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="range-label" id="rangeLabel">全书 1–488</span>
      </div>
      <div class="toolbar-right">
        <div class="page-jump">
          第 <input type="number" id="pageInput" min="1" max="488" value="1"> 页
          <button class="btn" id="jumpBtn">跳转</button>
        </div>
        <div class="width-ctrl">
          宽度 <input type="range" id="widthSlider" min="500" max="1200" value="860">
        </div>
      </div>
    </div>
    <div class="pages" id="pages"></div>
  </section>
</div>

<script>
const CHAPTERS = [
  {title:"封面·版权·前言·目录", start:1,   end:16},
  {title:"1. 集成电路器件",          start:17,  end:45},
  {title:"2. 工艺发展趋势",        start:46,  end:57},
  {title:"3. CMOS制造流程",        start:58,  end:86},
  {title:"4. 电介质薄膜沉积",      start:87,  end:113},
  {title:"5. 应力工程",            start:114, end:127},
  {title:"6. 金属薄膜与金属化",    start:128, end:159},
  {title:"7. 光刻技术",            start:160, end:244},
  {title:"8. 干法刻蚀",            start:245, end:285},
  {title:"9. 污染与清洗技术",      start:286, end:313},
  {title:"10. 超浅结技术",         start:314, end:326},
  {title:"11. 化学机械平坦化",     start:327, end:344},
  {title:"12. 器件参数与工艺",     start:345, end:349},
  {title:"13. 可制造性设计",       start:350, end:361},
  {title:"14. 器件失效分析",       start:362, end:399},
  {title:"15. 集成电路可靠性",     start:400, end:412},
  {title:"16. 集成电路测量",       start:413, end:433},
  {title:"17. 良率改善",           start:434, end:455},
  {title:"18. 测试工程",           start:456, end:466},
  {title:"19. 芯片封装",           start:467, end:487},
  {title:"尾页",                   start:488, end:488},
];
const TOTAL = 488;
const PAGE_DIR = "nano-ic-pages";

const chList   = document.getElementById("chList");
const pages    = document.getElementById("pages");
const rangeLabel = document.getElementById("rangeLabel");
const pageInput = document.getElementById("pageInput");
const jumpBtn  = document.getElementById("jumpBtn");
const widthSlider = document.getElementById("widthSlider");

let activeBtn = null;

// Build sidebar
const allBtn = makeChBtn("全书连续浏览", `1 – ${TOTAL}`, 1, TOTAL);
chList.appendChild(allBtn);
CHAPTERS.forEach(ch => {
  chList.appendChild(makeChBtn(ch.title, `${ch.start} – ${ch.end}`, ch.start, ch.end));
});

function makeChBtn(title, range, start, end) {
  const b = document.createElement("button");
  b.className = "ch-btn";
  b.innerHTML = `${title}<small>${range}</small>`;
  b.addEventListener("click", () => loadRange(start, end, b));
  return b;
}

function loadRange(start, end, btn) {
  if (activeBtn) activeBtn.classList.remove("active");
  if (btn) { btn.classList.add("active"); activeBtn = btn; }
  rangeLabel.textContent = (start === 1 && end === TOTAL) ? `全书 1 – ${TOTAL}` : `当前 ${start} – ${end}`;
  const frag = document.createDocumentFragment();
  for (let p = start; p <= end; p++) {
    const wrap = document.createElement("div");
    wrap.className = "page-wrap";
    wrap.id = `page-${p}`;
    wrap.innerHTML = `
      <div class="page-meta"><span>第 ${p} 页 / 共 ${TOTAL} 页</span></div>
      <img src="${PAGE_DIR}/p${String(p).padStart(3,"0")}.jpg"
           loading="${p < start + 3 ? "eager" : "lazy"}" decoding="async" alt="第${p}页">
    `;
    frag.appendChild(wrap);
  }
  pages.innerHTML = "";
  pages.appendChild(frag);
  window.scrollTo({top: document.querySelector(".reader").offsetTop - 70, behavior:"smooth"});
}

function jumpToPage() {
  const p = Math.max(1, Math.min(TOTAL, Number(pageInput.value) || 1));
  const existing = document.getElementById(`page-${p}`);
  if (existing) { existing.scrollIntoView({block:"start"}); return; }
  loadRange(p, p, null);
  setTimeout(() => document.getElementById(`page-${p}`)?.scrollIntoView({block:"start"}), 60);
}

jumpBtn.addEventListener("click", jumpToPage);
pageInput.addEventListener("keydown", e => { if (e.key === "Enter") jumpToPage(); });
widthSlider.addEventListener("input", e => {
  document.documentElement.style.setProperty("--page-width", e.target.value + "px");
});

// Default: chapter 1 (front matter)
const firstBtn = chList.querySelectorAll(".ch-btn")[1];
loadRange(1, 16, firstBtn);
</script>
  <script src="../assets/zz-home-button.js?v=20260703-home" defer></script>
</body>
</html>
