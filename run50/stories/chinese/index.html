<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run50 Chinese Stories</title>
  <style>
    :root {
      --paper: #f4f6f7;
      --surface: #ffffff;
      --ink: #20242b;
      --muted: #667085;
      --line: #dde5ec;
      --river: #0e7490;
      --brick: #a33a2b;
      --gold: #b7892f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #eef5f6 0, var(--paper) 320px);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }
    a { color: inherit; }
    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 42px 22px 64px;
    }
    .topline {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 14px;
    }
    .topline a {
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .topline a:hover { border-color: currentColor; }
    .hero {
      max-width: 720px;
      margin-bottom: 34px;
    }
    .kicker {
      margin: 0 0 12px;
      color: var(--brick);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 66px);
      line-height: 1;
      letter-spacing: 0;
    }
    .intro {
      margin: 18px 0 0;
      color: #344054;
      font-size: 17px;
      max-width: 660px;
    }
    .story-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }
    .story-card {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 18px 44px rgba(15, 23, 42, .08);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .story-card:hover {
      transform: translateY(-3px);
      border-color: rgba(14, 116, 144, .42);
      box-shadow: 0 24px 54px rgba(15, 23, 42, .12);
    }
    .story-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #e8edf1;
    }
    .story-copy {
      padding: 20px 20px 18px;
    }
    .story-meta {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
    }
    .story-title {
      margin: 0;
      color: #111827;
      font-size: 22px;
      line-height: 1.35;
      font-weight: 850;
    }
    .story-desc {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .story-foot {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }
    @media (max-width: 640px) {
      .shell { padding: 28px 18px 46px; }
      .intro { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topline" aria-label="页面导航">
      <a href="../../index.html">← Run50</a>
      <span>中文故事</span>
      <a href="../english/">English</a>
    </nav>

    <section class="hero">
      <p class="kicker">Run50 Stories · Chinese</p>
      <h1>中文故事</h1>
      <p class="intro">这里放 Run50 之外但同属跑步旅程的中文长文。以后新的比赛、旅行和训练故事都可以继续加到这里。</p>
    </section>

    <section class="story-grid" aria-label="中文故事列表">
      <a class="story-card" href="./xiangyang-marathon.html">
        <img src="../../../assets/thumb-run50-xiangyang-icons.svg" alt="襄阳马拉松城市图标封面" loading="lazy" decoding="async">
        <div class="story-copy">
          <p class="story-meta">湖北襄阳 · 2025.10.19</p>
          <h2 class="story-title">RunCN #第1站｜襄阳马拉松</h2>
          <p class="story-desc">从珞珈山到汉江边，回国第一跑意外跑进四小时。婚礼、武汉、襄阳古城和一条节奏友好的赛道。</p>
          <div class="story-foot">
            <span>长文图记</span>
            <span>阅读 →</span>
          </div>
        </div>
      </a>
      <a class="story-card" href="./guilin-marathon.html">
        <img src="../../../assets/thumb-run50-guilin-icons.svg" alt="桂林马拉松城市图标封面" loading="lazy" decoding="async">
        <div class="story-copy">
          <p class="story-meta">广西桂林 · 2025.11.16</p>
          <h2 class="story-title">RunCN #第2站｜桂林马拉松</h2>
          <p class="story-desc">热浪滚滚的一场桂林马拉松。漓江、穿山、七星、象鼻山，还有爸妈和姨妈在终点等我。</p>
          <div class="story-foot">
            <span>长文图记</span>
            <span>阅读 →</span>
          </div>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
