<style>
  :root {
    color-scheme: light;
    --bg: #f4f6f3;
    --panel: #ffffff;
    --panel-strong: #ffffff;
    --header: rgba(250,251,249,.94);
    --ink: #17201c;
    --muted: #617068;
    --line: #d8dfda;
    --soft: #e7ece8;
    --soft-2: #dde5df;
    --focus: #2675bb;
    --run: #a96208;
    --run-dim: rgba(169,98,8,.12);
    --shadow: 0 14px 36px rgba(23,42,32,.08);
    --map-ocean: #a8d4e8;
    --map-land: #d4c9a8;
    --map-us: #d4823a;
    --map-china: #5ca860;
    --map-mexico: #e8b040;
    --map-italy: #e05050;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121512;
    --panel: #1b201c;
    --panel-strong: #202720;
    --header: rgba(18,21,18,.94);
    --ink: #f2f5f1;
    --muted: #a9b5ad;
    --line: #343b35;
    --soft: #252b26;
    --soft-2: #303730;
    --focus: #65a9e3;
    --run: #d18b30;
    --run-dim: rgba(209,139,48,.14);
    --shadow: 0 16px 42px rgba(0,0,0,.22);
    --map-ocean: #1e3a4a;
    --map-land: #2a2e22;
    --map-us: #c46a20;
    --map-china: #3a8a44;
    --map-mexico: #b88028;
    --map-italy: #c03838;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    font-family: Inter, 'Segoe UI', Arial, sans-serif;
    transition: color .18s ease, background-color .18s ease;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ── HEADER ── */
  .hub-header {
    position: relative;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 14px;
    height: 54px;
    padding: 0 20px;
    background: var(--header);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 6px;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    transition: background .15s, color .15s;
  }
  .back-btn:hover { background: var(--soft); color: var(--ink); }

  .hub-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--run);
    letter-spacing: -.01em;
    flex: 1;
  }

  .theme-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    transition: background .15s;
    white-space: nowrap;
  }
  .theme-btn:hover { background: var(--soft); }

  /* ── MAIN TAB NAV ── */
  .hub-tabs {
    display: flex;
    gap: 0;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    overflow-x: auto;
  }

  .hub-tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 650;
    color: var(--muted);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  .hub-tab:hover { color: var(--ink); }
  .hub-tab.active { color: var(--run); border-bottom-color: var(--run); }

  /* ── CONTENT AREA ── */
  .hub-content {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .tab-pane {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
  }
  .tab-pane.active { display: flex; }

  .embed-frame {
    width: 100%;
    flex: 1;
    border: none;
    background: var(--bg);
    display: block;
  }

  /* ── MAP PANE ── */
  .map-shell {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  .map-subtabs {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .mtab {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 18px;
    border-radius: 20px;
    background: var(--soft);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    transition: all .15s;
  }
  .mtab:hover { color: var(--ink); background: var(--soft-2); }
  .mtab.active { background: var(--run); border-color: var(--run); color: #fff; }

  .map-views {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  .map-view { display: none; }
  .map-view.active { display: block; }

  .map-card {
    background: var(--panel);
    border-radius: 14px;
    border: 1px solid var(--line);
    padding: 20px;
    box-shadow: var(--shadow);
    max-width: 1040px;
    margin: 0 auto;
  }

  .map-card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 3px;
  }
  .map-card-sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .map-slot {
    position: relative;
    border-radius: 8px;
    overflow: visible;
  }

  #us-map-slot { aspect-ratio: 1722 / 989; }

  /* ── MAP TOOLTIP ── */
  .map-tooltip {
    position: fixed;
    z-index: 9999;
    background: rgba(10,14,10,.93);
    color: #e8f0e8;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.55;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    pointer-events: none;
    display: none;
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(8px);
    min-width: 170px;
    max-width: 240px;
  }
  .map-tooltip strong { color: #fff; font-size: 13px; }
  .map-tooltip a { color: #65a9e3; pointer-events: auto; }

  /* ── WORLD MAP ── */
  #world-map-master {
    border-radius: 8px;
    overflow: hidden;
  }
  #world-map-master .wm-country {
    cursor: pointer;
    transition: opacity .2s;
  }
  #world-map-master .wm-country:hover { opacity: .82; }
  .wm-dot {
    cursor: pointer;
    transition: r .15s;
  }
  .wm-dot:hover { r: 7; }

  /* ── US MAP colors ── */
  #us-map-master path { transition: fill .2s, opacity .2s; }
  #us-map-master path.run-state { cursor: pointer; }
  #us-map-master path.run-state:hover { opacity: .82; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .hub-header { padding: 0 14px; }
    .hub-tab { padding: 8px 10px; font-size: 12px; gap: 4px; }
    .map-card { padding: 14px; }
    .map-views { padding: 12px; }
    .mtab { padding: 5px 12px; font-size: 12px; }
  }
</style>

<script>
/* ====================================================
   THEME
   ==================================================== */
const themeToggle = document.getElementById('themeToggle');
const themeLabel  = document.getElementById('themeLabel');

function syncThemeLabel() {
  const dark = document.documentElement.dataset.theme === 'dark';
  themeLabel.textContent = dark ? 'Light' : 'Dark';
  themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('zz-theme', next);
  syncThemeLabel();
  // Rebuild world map SVG colors on theme change
  if (mapsInited) { _injectWorldMap(); }
});
syncThemeLabel();

/* ====================================================
   MAIN TABS
   ==================================================== */
const hubTabs  = [...document.querySelectorAll('.hub-tab')];
const tabPanes = [...document.querySelectorAll('.tab-pane')];

function switchTab(name) {
  hubTabs.forEach(t => {
    const on = t.dataset.tab === name;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', String(on));
  });
  tabPanes.forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
  history.replaceState(null, '', '#' + name);
  if (name === 'map') initMaps();
}

hubTabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

/* ====================================================
   MAP SUB-TABS
   ==================================================== */
const mapTabs  = [...document.querySelectorAll('.mtab')];
const mapViews = [...document.querySelectorAll('.map-view')];

mapTabs.forEach(t => t.addEventListener('click', () => {
  const tgt = t.dataset.map;
  mapTabs.forEach(x => x.classList.toggle('active', x.dataset.map === tgt));
  mapViews.forEach(v => v.classList.toggle('active', v.id === 'mv-' + tgt));
}));

/* ====================================================
   TOOLTIP HELPERS
   ==================================================== */
const tooltip = document.getElementById('mapTooltip');

function showTT(e, html) {
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  moveTT(e);
}
function hideTT() { tooltip.style.display = 'none'; }
function moveTT(e) {
  const x = e.clientX + 14, y = e.clientY - 10;
  const w = window.innerWidth, h = window.innerHeight;
  tooltip.style.left = (x + 240 > w ? x - 254 : x) + 'px';
  tooltip.style.top  = (y + 100 > h ? y - 90  : y) + 'px';
}
document.addEventListener('mousemove', e => { if (tooltip.style.display === 'block') moveTT(e); });

function _albers(lat, lon) {
  const lat0=37.5*Math.PI/180, lon0=-96*Math.PI/180;
  const lat1=29.5*Math.PI/180, lat2=45.5*Math.PI/180;
  const n=0.5*(Math.sin(lat1)+Math.sin(lat2));
  const C=Math.cos(lat1)**2+2*n*Math.sin(lat1);
  const rho0=Math.sqrt(C-2*n*Math.sin(lat0))/n;
  const lr=lat*Math.PI/180, lnr=lon*Math.PI/180;
  const th=n*(lnr-lon0), rho=Math.sqrt(C-2*n*Math.sin(lr))/n;
  return {x:1798.50*rho*Math.sin(th)+935.11, y:-1851.29*(rho0-rho*Math.cos(th))+579.07};
}

function _injectUSMap() {
  const slot = document.getElementById('us-map-slot');
  if (!slot || typeof US_MAP_SVG === 'undefined') return;
  slot.innerHTML = US_MAP_SVG;
  const master = document.getElementById('us-map-master');
  if (!master) return;
  master.style.cssText = 'width:100%;height:auto;display:block';

  // Mute all paths
  master.querySelectorAll('path').forEach(p => {
    const id = p.id.replace('map_','');
    if (!_SF.includes(id)) {
      p.style.pointerEvents = 'none';
      const f = p.getAttribute('fill')||'';
      if (/^#[0-9a-fA-F]{6}$/.test(f)) {
        const r=parseInt(f.slice(1,3),16),g=parseInt(f.slice(3,5),16),b=parseInt(f.slice(5,7),16);
        if (r*.299+g*.587+b*.114>=60) p.style.fill='none';
      }
    } else {
      p.style.fill='#d8e0d4';
      p.style.stroke='#fff';
      p.style.strokeWidth='0.8';
    }
  });

  // Color story states
  _storyStates.forEach(abbr => (_HM[abbr]||[]).forEach(id => {
    const el=document.getElementById('map_'+id);
    if(el){el.style.fill=_CM[abbr];el.classList.add('run-state');}
  }));
  // Color other run states
  _colorStates.forEach(abbr => (_HM[abbr]||[]).forEach(id => {
    const el=document.getElementById('map_'+id);
    if(el){el.style.fill=_CM[abbr];el.classList.add('run-state');}
  }));

  // City dots for story races
  let dg = master.querySelector('#hub-dots');
  if(!dg){ dg=document.createElementNS('http://www.w3.org/2000/svg','g'); dg.id='hub-dots'; master.appendChild(dg); }
  dg.innerHTML='';

  _storyStates.forEach(abbr => {
    (_RACES[abbr]||[]).forEach(r => {
      const cc=_CITY_LL[r.city]; if(!cc) return;
      const {x,y}=_albers(cc.lat,cc.lon);
      const glow=document.createElementNS('http://www.w3.org/2000/svg','circle');
      Object.entries({cx:x,cy:y,r:13,fill:'rgba(255,59,48,0.28)'}).forEach(([k,v])=>glow.setAttribute(k,v));
      glow.style.pointerEvents='none'; dg.appendChild(glow);

      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      Object.entries({cx:x,cy:y,r:6,fill:'#ff3b30',stroke:'#fff','stroke-width':'1.8'}).forEach(([k,v])=>dot.setAttribute(k,v));
      dot.style.cursor='pointer';
      dot.addEventListener('mouseenter', e => showTT(e,
        `<strong>${r.city}, ${abbr}</strong><br><span style="color:#9ab;">${r.date}</span>` +
        `<br><a href="${r.story}" target="_blank">Read Story →</a>` +
        (r.fb?`<br><a href="${r.fb}" target="_blank" style="color:#8ab4f8">Facebook →</a>`:'')));
      dot.addEventListener('mouseleave', hideTT);
      dot.addEventListener('click', e => { e.stopPropagation(); window.open(r.story,'_blank'); });
      dg.appendChild(dot);
    });
  });
}

  // Bind world map dot tooltips
  slot.querySelectorAll('.wm-dot').forEach(dot => {
    dot.addEventListener('mouseenter', e => {
      const {city,date,story} = dot.dataset;
      showTT(e, `<strong>${city}</strong><br><span style="color:#9ab;">${date}</span>` +
        (story ? `<br><a href="${story}" target="_blank">Read Story →</a>` : ''));
    });
    dot.addEventListener('mouseleave', hideTT);
    dot.addEventListener('click', e => { e.stopPropagation(); if (dot.dataset.story) window.open(dot.dataset.story,'_blank'); });
  });

  // Bind country hover
  slot.querySelectorAll('.wm-country').forEach(el => {
    const labels = {
      'USA':['United States','7+ marathons across US states'],
      'China':['China','Xiangyang · Guilin · Hong Kong'],
      'Mexico':['Mexico','Mexico City Marathon · 2024'],
      'Italy':['Italy','Pisa Marathon · 2025']
    };
    el.addEventListener('mouseenter', e => {
      const [name,sub] = labels[el.dataset.country]||[el.dataset.country,''];
      showTT(e, `<strong>${name}</strong>${sub?`<br><span style="color:#9ab;">${sub}</span>`:''}`);
    });
    el.addEventListener('mouseleave', hideTT);
  });
}

function initFromHash() {
  const h = location.hash.slice(1);
  const valid = ['home','chinese','english','facebook','map'];
  if (valid.includes(h)) switchTab(h);
}
initFromHash();
window.addEventListener('hashchange', initFromHash);
