name: Mirror published Pages to OSS Hong Kong

on:
  # Temporary, nonce-gated setup verification; removed immediately after success.
  push:
    branches: [main]
    paths: [.github/workflows/oss-mirror.yml]
  workflow_run:
    workflows: [Deploy Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_write:
        description: 'Verify one byte-identical analytics.js overwrite (preserves metadata)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read
  id-token: write

# Independent of Pages cancellation. New runs never interrupt an active upload.
concurrency:
  group: oss-hongkong-published-site
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      github.repository == 'ArsenanZZ/ZZ' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.event.head_commit.message == 'Verify one byte-identical OSS write [oss-smoke-20261004-2047]') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'ArsenanZZ/ZZ' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted mirror implementation only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test mirror safety checks
        run: python -m unittest discover -s .github/scripts -p 'test_oss_mirror.py' -v
      - name: Select latest successful trusted Pages deployment
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/oss_mirror.py select-run
      - name: Download exactly the deployed Pages artifact
        if: steps.source.outputs.selected == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zz-pages
          path: ${{ runner.temp }}/pages-download
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Validate and extract published files
        if: steps.source.outputs.selected == 'true'
        run: >-
          python .github/scripts/oss_mirror.py extract
          --archive "$RUNNER_TEMP/pages-download/artifact.tar"
          --site "$RUNNER_TEMP/published-site"
      - name: Install pinned official OSS SDK
        if: steps.source.outputs.selected == 'true'
        run: python -m pip install --disable-pip-version-check oss2==2.19.1
      - name: Obtain temporary scoped OSS credentials through OIDC
        if: steps.source.outputs.selected == 'true'
        id: aliyun
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          role-to-assume: acs:ram::1345991126593546:role/zz-oss-publisher
          oidc-provider-arn: acs:ram::1345991126593546:oidc-provider/github-actions-zz
          audience: sts.aliyuncs.com
          role-session-name: github-zz-oss-${{ github.run_id }}
          role-session-expiration: 3600
      - name: Incrementally upload and verify the Hong Kong mirror
        if: steps.source.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_WRITE: ${{ (github.event_name == 'workflow_dispatch' && inputs.verify_write) || (github.event_name == 'push' && github.event.head_commit.message == 'Verify one byte-identical OSS write [oss-smoke-20261004-2047]') }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ steps.aliyun.outputs.aliyun-access-key-id }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ steps.aliyun.outputs.aliyun-access-key-secret }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ steps.aliyun.outputs.aliyun-security-token }}
        run: |
          args=(sync --site "$RUNNER_TEMP/published-site" --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT")
          if [ "$VERIFY_WRITE" = 'true' ]; then args+=(--verify-write); fi
          python .github/scripts/oss_mirror.py "${args[@]}"
