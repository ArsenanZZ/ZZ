name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='_site/' \
            --exclude='scratch/' \
            --exclude='tools/' \
            --exclude='work/' \
            ./ _site/

      - name: Optimize images for artifact
        run: |
          if ! command -v mogrify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          before=$(du -sb _site | cut -f1)
          story_before=$(du -sb _site/run50/stories/chinese | cut -f1)
          assets_before=$(du -sb _site/assets | cut -f1)

          find _site/run50/stories/chinese -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -size +90k -print0 \
            | xargs -0 -r -n 12 -P 4 mogrify -resize '1800x1800>' -quality 68 -strip

          find _site/assets -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -size +250k -print0 \
            | xargs -0 -r -n 12 -P 4 mogrify -resize '1400x1400>' -quality 72 -strip

          find _site/assets -type f -iname '*.png' -size +500k -print0 \
            | while IFS= read -r -d '' png; do
                jpg="${png%.*}.jpg"
                convert "$png" -resize '1400x1400>' -quality 76 -strip "$jpg"
                rm "$png"
                printf '%s\t%s\n' "$(basename "$png")" "$(basename "$jpg")" >> _site/.converted-assets.tsv
              done

          if [ -f _site/.converted-assets.tsv ]; then
            python3 - <<'PY'
          from pathlib import Path

          mapping = []
          for line in Path("_site/.converted-assets.tsv").read_text(encoding="utf-8").splitlines():
              if line.strip():
                  old, new = line.split("\t", 1)
                  mapping.append((old, new))

          for path in Path("_site").rglob("*"):
              if path.is_file() and path.suffix.lower() in {".html", ".css", ".js", ".json", ".xml", ".svg"}:
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  updated = text
                  for old, new in mapping:
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")
          PY
          fi

          story_after=$(du -sb _site/run50/stories/chinese | cut -f1)
          assets_after=$(du -sb _site/assets | cut -f1)
          after=$(du -sb _site | cut -f1)
          echo "Chinese story bytes: $story_before -> $story_after"
          echo "Assets bytes: $assets_before -> $assets_after"
          echo "Site artifact bytes: $before -> $after"

      - name: Archive site artifact
        run: tar --dereference --hard-dereference -C _site -cf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: zz-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: zz-pages
