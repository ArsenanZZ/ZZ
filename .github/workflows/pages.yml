name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='_site/' \
            --exclude='scratch/' \
            --exclude='tools/' \
            --exclude='work/' \
            ./ _site/

      - name: Optimize story images for artifact
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          root = Path("_site/run50/stories/chinese")
          if not root.exists():
              print("No Chinese story image directory found.")
              raise SystemExit(0)

          max_side = 1600
          min_bytes = 700 * 1024
          patterns = ("*.jpg", "*.jpeg", "*.png", "*.webp")
          files = []
          for pattern in patterns:
              files.extend(root.rglob(pattern))

          before = sum(path.stat().st_size for path in files)
          changed = 0
          for path in files:
              try:
                  size = path.stat().st_size
                  with Image.open(path) as image:
                      image = ImageOps.exif_transpose(image)
                      original_mode = image.mode
                      needs_resize = max(image.size) > max_side
                      if size < min_bytes and not needs_resize:
                          continue
                      image.thumbnail((max_side, max_side), Image.Resampling.LANCZOS)
                      suffix = path.suffix.lower()
                      save_kwargs = {"optimize": True}
                      if suffix in (".jpg", ".jpeg"):
                          if image.mode not in ("RGB", "L"):
                              image = image.convert("RGB")
                          save_kwargs.update(quality=70, progressive=True)
                      elif suffix == ".webp":
                          if image.mode == "P":
                              image = image.convert("RGBA")
                          save_kwargs.update(quality=70, method=6)
                      elif suffix == ".png":
                          if original_mode == "P":
                              image = image.convert("P", palette=Image.Palette.ADAPTIVE)
                      image.save(path, **save_kwargs)
                      changed += 1
              except Exception as error:
                  print(f"Skipped {path}: {error}")

          after = sum(path.stat().st_size for path in files)
          print(f"Optimized {changed} story images.")
          print(f"Story image bytes: {before} -> {after}")
          PY

      - name: Archive site artifact
        run: tar --dereference --hard-dereference -C _site -cf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: zz-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: zz-pages
