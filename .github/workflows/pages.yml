name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='_site/' \
            --exclude='scratch/' \
            --exclude='tools/' \
            --exclude='work/' \
            ./ _site/

      - name: Optimize story images for artifact
        run: |
          if ! command -v mogrify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          before=$(du -sb _site/run50/stories/chinese | cut -f1)
          find _site/run50/stories/chinese -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -size +700k -print0 \
            | xargs -0 -r -n 12 -P 4 mogrify -resize '1600x1600>' -quality 70 -strip
          after=$(du -sb _site/run50/stories/chinese | cut -f1)
          echo "Chinese story bytes: $before -> $after"

      - name: Archive site artifact
        run: tar --dereference --hard-dereference -C _site -cf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: zz-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: zz-pages
